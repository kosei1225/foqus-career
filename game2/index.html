<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>わたし株式会社 週末の焼き菓子</title>
<meta name="description" content="週末に焼き菓子を作って売る1年を、1か月ずつ経営するゲームの試作品。">
<meta name="robots" content="noindex, nofollow">
<style>
/* Layout: 帳簿のようなダッシュボード。上にお金と時間、真ん中に「先月の帳簿 → 今月の場面 → 今月の作戦」、下に年表。
   ベージュの紙・深緑・蛍光グリーン（差し色は「やってみる」ボタンと現実の記録だけ）。角は4pxまで、影・グラデーションなし */
:root {
  color-scheme: light;
  --paper: #EFEDE4; --sheet: #FFFFFF; --ink: #1C2B22; --muted: #6E7A72; --line: #D8D4C8;
  --deep: #16301F; --pop: #00D959; --warn: #C77B3A; --floor: #E4E1D6; --sky: #F4F5EF; --on-ink: #FFFFFF;
  --f-head: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "BIZ UDPMincho", serif;
  --f-body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic", "Noto Sans JP", "Meiryo", sans-serif;
  --hud-h: 64px; --dock-h: 96px; --r: 4px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 600; line-height: 1.45; text-wrap: balance; }
h1, h2 { font-family: var(--f-head); }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--deep); outline-offset: 2px; }

/* 上：お金・体力・常連 */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--sheet); }
.hud { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 20; background: var(--sheet); border-bottom: 1px solid var(--line); }
.hud-in { max-width: 600px; margin: 0 auto; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 4px; }
.hud-top { display: flex; align-items: baseline; gap: 10px; }
.hud-top .co { font-family: var(--f-head); font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hud-top .mo { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }
.kpis { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.3fr) minmax(0, .8fr) minmax(0, .8fr); gap: 6px; }
.kpi { display: grid; gap: 0; min-width: 0; }
.kpi .k { font-size: 11px; color: var(--muted); font-weight: 700; }
.kpi .v { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v small { font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 2px; }
.kpi.warn .v { color: var(--warn); }
.kpi .bar { height: 4px; background: var(--line); margin-top: 3px; }
.kpi .bar i { display: block; height: 100%; background: var(--ink); }
.kpi.warn .bar i { background: var(--warn); }

main { max-width: 600px; margin: 0 auto; padding-top: calc(var(--hud-h) + env(safe-area-inset-top, 0px) + 12px); padding-bottom: calc(var(--dock-h) + env(safe-area-inset-bottom, 0px) + 18px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
.banner { font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.banner b { color: var(--ink); }
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.panel h2 { font-size: 18px; }
.panel h3 { font-size: 15px; }
.kicker { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.lead { font-size: 14px; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); line-height: 1.6; }
.txt { font-size: 14px; }

/* 店の様子 */
.shop svg { display: block; width: 100%; height: auto; }
.shop { padding: 0; overflow: hidden; gap: 0; }
.shop-cap { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 6px 12px 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.shop-cap b { color: var(--ink); }

/* 帳簿 */
.ledger-top { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.big { display: grid; min-width: 0; }
.big .k { font-size: 11px; color: var(--muted); font-weight: 700; }
.big .v { font-family: var(--f-head); font-size: 20px; font-weight: 600; line-height: 1.3; white-space: nowrap; }
.big .v.neg { color: var(--warn); }
.big .s { font-size: 11px; color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 300px; }
.tbl th, .tbl td { text-align: right; padding: 5px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { font-size: 11px; color: var(--muted); font-weight: 700; }
.why { display: grid; gap: 4px; font-size: 13px; }
.why p { padding-left: 14px; position: relative; }
.why p::before { content: ""; position: absolute; left: 2px; top: .7em; width: 5px; height: 5px; background: var(--muted); }
.why p.sub::before { display: none; }
.voices { display: grid; gap: 6px; }
.voice { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; display: grid; gap: 2px; font-size: 13px; }
.voice .tag { font-size: 11px; font-weight: 700; }
.voice.fact { border-left: 3px solid var(--deep); }
.voice.fact .tag { color: var(--deep); }
.voice.opinion { border-left: 3px solid var(--line); background: var(--paper); }
.voice.opinion .tag { color: var(--muted); }
.wordget { border: 1px solid var(--ink); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 2px; }
.wordget .k { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.wordget b { font-family: var(--f-head); font-size: 17px; }
.wordget p { font-size: 13px; }

/* 場面 */
.scene { border-left: 4px solid var(--deep); }
.scene .who { font-size: 12px; color: var(--muted); }
.choices { display: grid; gap: 8px; }
.picked { font-size: 14px; border-top: 1px dashed var(--line); padding-top: 8px; }

/* 作戦 */
.plan { gap: 14px; }
.row-set { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 10px; align-items: center; }
.row-set > .lab { font-size: 13px; font-weight: 700; }
.stepper { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.stepper button { width: 40px; height: 40px; border-radius: var(--r); border: 1px solid var(--ink); background: var(--sheet); font-size: 18px; font-weight: 700; cursor: pointer; }
.stepper .val { min-width: 4.6em; text-align: center; font-weight: 700; font-size: 17px; }
.stepper .note { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--sheet); border-radius: 2px; padding: 6px 10px; font-size: 13px; cursor: pointer; min-height: 38px; line-height: 1.35; text-align: left; }
.chip small { display: block; font-size: 11px; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--deep); background: var(--deep); color: var(--on-ink); }
.chip[aria-pressed="true"] small { color: #CFE0D6; }
.chip:disabled { opacity: .45; cursor: default; }
.sub { border: 1px dashed var(--line); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; }
.sub .lab { font-size: 12px; font-weight: 700; }
.timebar { display: grid; gap: 4px; }
.timebar .tb { position: relative; height: 12px; background: var(--paper); border: 1px solid var(--line); }
.timebar .tb i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
.timebar.over .tb i { background: var(--warn); }
.timebar .tl2 { display: flex; justify-content: space-between; font-size: 12px; }
.timebar.over .tl2 b { color: var(--warn); }
.costline { font-size: 12px; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 10px 18px; border-radius: var(--r); border: 1px solid var(--ink); background: var(--sheet); font-weight: 700; cursor: pointer; text-align: center; }
.btn.pri { background: var(--pop); border-color: var(--pop); color: var(--ink); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.btn.ghost { border-color: var(--line); background: transparent; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.linkish { background: none; border: 0; padding: 4px 0; font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; justify-self: start; }
.go { display: grid; gap: 8px; }

/* 仮説 */
.hyp { display: grid; gap: 8px; }
.hq { display: grid; gap: 2px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--sheet); }
.hq .q { font-size: 12px; font-weight: 700; color: var(--muted); }
.hq .a { font-size: 14px; font-weight: 700; }
.hq .meter { height: 5px; background: var(--line); }
.hq .meter i { display: block; height: 100%; background: var(--deep); }
.hq.ok { border-color: var(--deep); }
.hq .st { font-size: 11px; font-weight: 700; }
.hq.ok .st { color: var(--deep); }

/* 下：年表とメニュー */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--sheet); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock-in { max-width: 600px; margin: 0 auto; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.tl { overflow-x: auto; padding-block: 8px 4px; }
.tl-row { display: flex; gap: 3px; min-width: min-content; align-items: flex-end; }
.tl .c { position: relative; width: 24px; height: 26px; border-radius: 1px; border: 1px solid var(--line); background: var(--paper); padding: 0; cursor: pointer; font-size: 9px; line-height: 1; color: var(--muted); display: grid; place-items: end center; padding-bottom: 2px; }
.tl .c.plus { background: var(--deep); border-color: var(--deep); color: var(--on-ink); }
.tl .c.minus { background: var(--warn); border-color: var(--warn); color: var(--on-ink); }
.tl .c.zero { background: var(--line); }
.tl .c.now { background: var(--sheet); border: 2px solid var(--deep); color: var(--ink); }
.tl .c.fork::before { content: ""; position: absolute; left: -1px; right: -1px; top: -6px; height: 3px; background: var(--deep); }
.tl .c.real::after { content: ""; position: absolute; right: 2px; top: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--pop); }
.nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding-block: 2px 6px; }
.nav button { min-height: 40px; border: 0; background: none; font-size: 12px; font-weight: 700; cursor: pointer; border-radius: var(--r); padding: 4px 2px; line-height: 1.3; }
.nav button:hover { background: var(--paper); }
.nav .exit { color: var(--deep); }

/* 重ねて出す画面 */
.sheet { position: fixed; inset: 0; z-index: 40; background: rgba(28, 43, 34, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet[hidden] { display: none !important; }
.sheet-in { width: 100%; max-width: 600px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); overflow: auto; background: var(--paper); border-radius: var(--r) var(--r) 0 0; padding-block: 18px calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; align-content: start; }
@media (min-width: 660px) { .sheet { align-items: center; } .sheet-in { border-radius: var(--r); max-height: calc(100% - 48px); } }
.sheet-in h2 { font-size: 20px; }
.sheet-in section { display: grid; gap: 8px; }
.opts { display: grid; gap: 6px; }
.opt { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; font-size: 14px; line-height: 1.55; }
.opt input { margin-top: 3px; accent-color: var(--deep); width: 18px; height: 18px; flex: none; }
.opt.on { border-color: var(--deep); }
.opt small { display: block; color: var(--muted); font-size: 12px; }
.field { display: grid; gap: 4px; font-size: 13px; font-weight: 700; }
.field input, .field textarea { font-weight: 400; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--sheet); width: 100%; }
.field textarea { min-height: 84px; resize: vertical; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row .btn { flex: 1 1 140px; }
.warnbox { border: 1px solid var(--warn); background: var(--sheet); border-radius: var(--r); padding: 10px 12px; font-size: 13px; }
.note-prev { background: var(--sheet); border-left: 3px solid var(--deep); padding: 10px 12px; font-size: 14px; }
.bigline { font-family: var(--f-head); font-size: 18px; }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 90px; border-bottom: 1px solid var(--line); position: relative; }
.bars i { flex: 1; display: block; background: var(--deep); min-height: 1px; }
.bars i.neg { background: var(--warn); }
.bars-l { display: flex; gap: 3px; font-size: 10px; color: var(--muted); }
.bars-l span { flex: 1; text-align: center; }
.dex { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.dx { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; min-height: 76px; display: grid; align-content: start; gap: 2px; min-width: 0; }
.dx b { font-family: var(--f-head); font-size: 15px; }
.dx p { font-size: 12px; line-height: 1.5; }
.dx.off b { color: var(--line); font-size: 18px; letter-spacing: .1em; }
.routes { display: grid; gap: 8px; }
.route { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 6px; }
.route.cur { border-color: var(--deep); }
.route .rh { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; flex-wrap: wrap; }
.route .c { width: 16px; height: 16px; cursor: default; }
.route .c.shared { opacity: .3; }
.rest { min-height: 50vh; display: grid; place-items: center; text-align: center; gap: 14px; padding-block: 40px; }
.rest p { color: var(--muted); }
textarea.code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; min-height: 120px; }

/* 店の図（線と形だけ） */
.o-wall { fill: var(--sheet); } .o-floor { fill: var(--floor); } .o-ln { stroke: var(--line); stroke-width: 1; }
.o-frame { stroke: var(--ink); stroke-width: 1.5; } .o-none { fill: none; } .o-white { fill: var(--sheet); }
.o-ink { fill: var(--ink); } .o-muted { fill: var(--muted); } .o-deep { fill: var(--deep); } .o-paper { fill: var(--paper); } .o-pop { fill: var(--pop); }
.o-t { fill: var(--muted); font-size: 8px; font-family: var(--f-body); }
.o-tw { fill: var(--on-ink); font-size: 8px; font-family: var(--f-body); }
.o-leg { stroke: var(--ink); stroke-width: 1.5; }
.o-dark { fill: var(--ink); }
@media (min-width: 720px) { .dex { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 380px) { table.tbl { min-width: 0; font-size: 12px; } .tbl th, .tbl td { padding: 4px 3px; } .tbl th { font-size: 10px; } .kpi .v { font-size: 13px; } .kpi .v small { font-size: 10px; } .ledger-top { grid-template-columns: repeat(2, minmax(0, 1fr)); } .row-set { grid-template-columns: minmax(0, 1fr); gap: 4px; } }

</style>
</head>
<body>
<header class="hud"><div class="hud-in"><div class="hud-top"><span class="co" id="co">わたしの焼き菓子</span><span class="mo num" id="mo"></span></div><div class="kpis" id="kpis"></div></div></header>
<main>
  <div class="banner" id="banner"></div>
  <section class="panel shop" id="shop" aria-label="台所と売り場"></section>
  <section id="flow" class="go" aria-live="polite"></section>
</main>
<footer class="dock"><div class="dock-in">
  <div class="tl" id="tl" aria-label="年表"></div>
  <nav class="nav" aria-label="メニュー">
    <button type="button" data-act="hyp">仮説<br>ボード</button>
    <button type="button" data-act="words">ことば</button>
    <button type="button" class="exit" data-act="exit">今日は<br>ここまで</button>
    <button type="button" data-act="menu">メニュー</button>
  </nav>
</div></footer>
<div class="sheet" id="sheet" hidden></div>
<script>
/* わたし株式会社 試作2「週末の焼き菓子」：中身（場面・人・声・ことば）
   数字の意味は engine2.js の先頭を参照。表示する文はすべてここ。 */
(function (root) {
  var D = (root.WK2 = root.WK2 || {}).DATA = {};

  // ---------------- 立場 ----------------
  D.ROLES = {
    worker: { label: "会社で働いている", hours: 26, cash: 50000, place: "職場", job: "仕事", friend: "同期のミカ",
      note: "平日は仕事。土日に使えるのは、月に26時間くらい。焼き菓子に使えるお金（元手）は5万円。" },
    student: { label: "学生", hours: 40, cash: 20000, place: "学校", job: "授業と課題", friend: "同じクラスのミカ",
      note: "授業のあと・土日に使えるのは、月に40時間くらい。元手はバイト代から2万円。" }
  };

  // ---------------- お客さん（だれが本当に買うかは、遊ぶたびに変わる） ----------------
  // key：その人たちに効く工夫。wtp：払ってもいい値段（1袋）の目安
  D.SEGS = {
    A: { label: { worker: "職場の人", student: "学校の友だち" }, key: "flavor", wtp: { worker: 380, student: 300 },
      job: { worker: "仕事の合間の気分転換", student: "放課後の小腹" } },
    B: { label: "子育て中の親", key: "label", wtp: 460, job: "子どものおやつを、安心できるものにしたい" },
    C: { label: "手みやげを探す人", key: "wrap", wtp: 470, job: "人に渡して、喜ばれたい" }
  };
  D.FEATURES = {
    label: { label: "原材料のラベル", desc: "何が入っていて、何が入っていないかを、袋に書く。1袋+10円。", cost: 10 },
    wrap: { label: "個包装と箱", desc: "1枚ずつ包んで、箱に入れる。見た目が手みやげになる。1袋+50円。", cost: 50 },
    flavor: { label: "新しい味", desc: "味を1つ増やす（いまは1種類）。選ぶ楽しさが増え、飽きにくい。", cost: 0 }
  };

  // ---------------- 売る場所 ----------------
  // exposure：1か月に知ってもらえる人の数、mix：お客さんの内わけ、conv：知った人が買う割合のもと
  D.CHANNELS = {
    work: { label: { worker: "職場で売る", student: "学校で売る" }, short: { worker: "職場", student: "学校" }, exposure: 25, mix: { A: 0.7, B: 0.2, C: 0.1 }, conv: 0.35, goodwill: true },
    friends: { label: "知り合いに売る", short: "知り合い", exposure: 0, mix: { A: 0.4, B: 0.3, C: 0.3 }, conv: 0.3, goodwill: true },
    market: { label: "マルシェ", short: "マルシェ", exposure: 300, mix: { A: 0.25, B: 0.45, C: 0.3 }, conv: 0.12 },
    bakery: { label: "佐藤さんのパン屋", short: "パン屋", exposure: 600, mix: { A: 0.2, B: 0.4, C: 0.4 }, conv: 0.07, retail: 450, wholesale: 300 },
    online: { label: "ネット", short: "ネット", exposure: 150, mix: { A: 0.1, B: 0.2, C: 0.7 }, conv: 0.05, ship: 200, fee: 0.1 }
  };

  // ---------------- 今月やること ----------------
  D.ACTIONS = {
    interview: { label: "話を聞く（2人）", hours: 2, cash: 0, desc: "だれに、どう聞くかを選ぶ。" },
    market: { label: "マルシェに出る", hours: 5, cash: 3000, desc: "出店料3,000円・朝7時から。知らない人に、直接知ってもらえる。" },
    trial: { label: "試作する", hours: 3, cash: 2000, desc: "ラベル・個包装と箱・新しい味のどれかを、1つ加える。" },
    sns: { label: "SNSに載せる", hours: 1, cash: 0, desc: "知り合いの外にも、少し届く。" },
    online: { label: "ネットで売る準備", hours: 3, cash: 0, desc: "来月から、ネットでも売れる。送料200円はこちら持ち、手数料1割。" },

      html += '<p class="txt">' + msg + '</p><button class="btn pri wide" data-act="run">この形で1か月やってみる</button></div>';
      return html;
    }
    var avail = E.hoursAvail(G, S), used = E.planHours(G, S), over = used > avail;
    var uc = E.unitCost(S, mods.wrapMonth);
    // 値段
    html += '<div class="row-set"><span class="lab">1袋の値段</span><div class="stepper"><button type="button" data-act="p-" aria-label="値段を50円下げる">−</button><span class="val num">' + p.price + '円</span><button type="button" data-act="p+" aria-label="値段を50円上げる">＋</button><span class="note">材料費 1袋' + uc + "円</span></div></div>";
    // 作る数
    html += '<div class="row-set"><span class="lab">作る数</span>' + (mods.preorder ? '<p class="txt">予約の分だけ作ります。</p>' :
      '<div class="stepper"><button type="button" data-act="m-" aria-label="10袋減らす">−</button><span class="val num">' + p.make + '袋</span><button type="button" data-act="m+" aria-label="10袋増やす">＋</button><span class="note">焼く時間 ' + (Math.round(p.make * E.makeRate(S) * 10) / 10) + "時間</span></div>") + "</div>";
    var pl = E.node(G).parent ? G.nodes[E.node(G).parent].log : null;
    if (pl && !mods.preorder) html += '<p class="hint">先月：' + pl.made + "袋作って" + pl.sold + "袋売れた" + (pl.wasted ? "・" + pl.wasted + "袋売れ残り" : "") + (pl.missed ? "・売り切れで約" + pl.missed + "袋分買えなかった人がいた" : "") + (pl.bigSold ? "（うち大口" + pl.bigSold + "袋）" : "") + "</p>";
    if (mods.big) html += '<p class="hint">大口の注文 ' + mods.big + "袋（1袋250円）は、作った数から先に回します。いつもの分と合わせて作ってください。</p>";
    // 売る場所
    var chips = [["work", true], ["friends", true]];
    if (S.bakery) chips.push(["bakery", true]);
    if (S.onlineReady) chips.push(["online", true]);
    html += '<div class="row-set"><span class="lab">売る場所</span><div class="chips">' + chips.map(function (c) {
      return '<button type="button" class="chip" data-act="ch" data-ch="' + c[0] + '" aria-pressed="' + (p.ch[c[0]] ? "true" : "false") + '">' + esc(E.chLabel(G, c[0])) + "</button>";
    }).join("") + (mods.bakeryTrial ? '<span class="chip" aria-pressed="true">佐藤さんのパン屋（今月だけ）</span>' : "") + (mods.market ? '<span class="chip" aria-pressed="true">マルシェ（田中さんの誘い）</span>' : "") + "</div></div>";
    // 今月やること
    var acts = E.availableActs(G, S).filter(function (a) { return !(a === "market" && mods.market); });
    html += '<div class="row-set"><span class="lab">今月やること</span><div class="chips">' + acts.map(function (a) {
      var A = D.ACTIONS[a], on = (p.acts || []).indexOf(a) >= 0;
      var cost = a === "trial" && S.freeTrial ? "無料" : A.cash ? A.cash.toLocaleString() + "円" : "";
      return '<button type="button" class="chip" data-act="act" data-a="' + a + '" aria-pressed="' + on + '">' + esc(A.label) + "<small>" + A.hours + "時間" + (cost ? "・" + cost : "") + "</small></button>";
    }).join("") + "</div></div>";
    // 聞く
    if ((p.acts || []).indexOf("interview") >= 0) {
      var whoOpts = [["work", G.meta.role === "student" ? "学校の人" : "職場の人"], ["friends", "知り合い"]];
      if (S.marketDone || mods.market || (p.acts || []).indexOf("market") >= 0) whoOpts.push(["market", "マルシェのお客さん"]);
      if (S.bakery || mods.bakeryTrial) whoOpts.push(["bakery", "パン屋のお客さん"]);
      html += '<div class="sub"><span class="lab">だれに、どう聞く？（2人）</span>';
      for (var k = 0; k < 2; k++) {
        var iv = (p.interviews || [])[k] || {};
        html += '<span class="hint">' + (k + 1) + '人目</span><div class="chips" aria-label="' + (k + 1) + '人目の相手">' + whoOpts.map(function (w) { return '<button type="button" class="chip" data-act="iv-ch" data-k="' + k + '" data-ch="' + w[0] + '" aria-pressed="' + (iv.ch === w[0]) + '">' + esc(w[1]) + "</button>"; }).join("") + "</div>" +
          '<div class="chips" aria-label="' + (k + 1) + '人目の聞き方">' + ["opinion", "fact"].map(function (a) { return '<button type="button" class="chip" data-act="iv-ask" data-k="' + k + '" data-ask="' + a + '" aria-pressed="' + (iv.ask === a) + '">' + esc(D.ASK[a].label) + "</button>"; }).join("") + "</div>";
      }
      html += "</div>";
    }
    if ((p.acts || []).indexOf("trial") >= 0) {
      html += '<div class="sub"><span class="lab">何を試作する？</span><div class="chips">' + ["label", "wrap", "flavor"].map(function (f) {
        var done = f === "flavor" ? S.feat.flavor >= 3 : S.feat[f];
        return '<button type="button" class="chip" data-act="trial" data-f="' + f + '" aria-pressed="' + (p.trial === f) + '"' + (done ? " disabled" : "") + ">" + esc(D.FEATURES[f].label) + (f === "flavor" && S.feat.flavor ? "（いま" + (S.feat.flavor + 1) + "種類）" : "") + "<small>" + esc(D.FEATURES[f].desc) + "</small></button>";
      }).join("") + "</div></div>";
    }
    if (S.helperSpot) html += '<div class="row-set"><span class="lab">手伝い</span><div class="chips"><button type="button" class="chip" data-act="help" aria-pressed="' + !!p.helperUse + '">今月はミカに頼む<small>+10時間・3,000円</small></button></div></div>';
    if (S.kitchen) html += '<div class="row-set"><span class="lab">キッチン</span><div class="chips"><button type="button" class="chip" data-act="kitchen" aria-pressed="' + !!p.kitchenUse + '">共同キッチンを使う<small>焼く時間が3割短い・月5,000円</small></button></div></div>';
    // 時間とお金
    var pct = Math.min(100, Math.round(used / Math.max(1, avail) * 100));
    html += '<div class="timebar' + (over ? " over" : "") + '"><div class="tl2"><span>使う時間</span><b class="num">' + used + " / " + avail + '時間</b></div><div class="tb"><i style="width:' + pct + '%"></i></div>' +
      (over ? '<p class="hint">使える時間をこえています。このままやると、体力が落ちます。</p>' : "") + "</div>";
    var cost = (mods.preorder ? 0 : p.make * uc) + ((p.acts || []).indexOf("market") >= 0 || mods.market ? 3000 : 0) + ((p.acts || []).indexOf("trial") >= 0 && !S.freeTrial ? 2000 : 0) + (S.helperSpot && p.helperUse ? 3000 : 0) + (S.kitchen && p.kitchenUse ? 5000 : 0);
    html += '<p class="costline">先に出ていくお金：約' + cost.toLocaleString() + "円（元手 " + yen(S.cash) + "）</p>";
    var need = needInput(S);
    html += (need ? '<p class="warnbox">' + need + "</p>" : "") + '<button class="btn pri wide" data-act="run"' + (need ? " disabled" : "") + ">この作戦で1か月やってみる</button></div>";
    return html;
  }
  function needInput(S) {
    var p = S.plan;
    if ((p.acts || []).indexOf("interview") >= 0) {
      var ivs = p.interviews || [];
      if (ivs.length < 2 || !ivs[0].ch || !ivs[1].ch || !ivs[0].ask || !ivs[1].ask) return "話を聞く相手と、聞き方を、2人分えらんでください。";
    }
    if ((p.acts || []).indexOf("trial") >= 0 && !p.trial) return "何を試作するか、えらんでください。";
    return "";
  }

  // ---------- 仮説 ----------
  function hypHtml() {
    var S = E.ensureLive(G), k = E.known(G, S), T = G.meta.truth;
    var facts = S.quotes.filter(function (q) { return q.kind === "fact"; });
    function row(q, ok, val, ev, hint) {
      return '<div class="hq' + (ok ? " ok" : "") + '"><span class="q">' + q + '</span><span class="a">' + (ok ? esc(val) : "まだ分からない") + '</span><span class="meter"><i style="width:' + ev + '%"></i></span><span class="st">' + (ok ? "たしかめた" : esc(hint)) + "</span></div>";
    }
    var html = '<div class="hyp">' +
      row("だれが、いちばん買ってくれる？", k.who, E.segLabel(G, T.main), S.ev.who, "あったことを聞く・売ってみると、分かってくる") +
      row("その人は、何のために買う？", k.job, E.segJob(G, T.main) + "（効く工夫：" + D.FEATURES[D.SEGS[T.main].key].label + "）", S.ev.job, "あったことを聞くと、分かってくる") +
      row("いくらまでなら払う？", k.wtp, "1袋 " + T.wtp[T.main] + "円くらい（" + D.FEATURES[D.SEGS[T.main].key].label + "をつけると、" + E.wtpWithKey(G) + "円くらいまで）", S.ev.wtp, "あったことを聞く・売ってみると、分かってくる") + "</div>";
    if (facts.length || S.opinions) html += '<p class="hint">集めた声：あったこと ' + facts.length + "件・意見 " + S.opinions + "件</p>";
    return html;
  }
  function openHyp() {
    var S = E.ensureLive(G);
    var qs = S.quotes.slice().reverse();
    sheet("<h2>仮説ボード</h2><p class=\"lead\">本当の答えは、ゲームの中に隠れています。調べたり考えたりしても出てきません。お客さんに、あったことを聞くか、売ってみると、少しずつ分かります。</p>" + hypHtml() +
      (qs.length ? "<section><h3>集めた声（新しい順）</h3>" + voicesHtml(qs) + "</section>" : "") + '<button class="btn ghost wide" data-act="close">閉じる</button>');
  }

  // ---------- 年表 ----------
  function cellsHtml(path, opt) {
    opt = opt || {};
    var real = {}; G.meta.real.forEach(function (r) { if (r.status === "done") real[r.m] = 1; });
    return '<div class="tl-row">' + path.map(function (n) {
      var cls = "c";
      if (opt.dimBefore !== undefined && n.m < opt.dimBefore) cls += " shared";
      if (n.log) cls += n.log.profit > 0 ? " plus" : n.log.profit < 0 ? " minus" : " zero";
      else if (n.id === G.cur && !opt.small) cls += " now";
      if (n.fork) cls += " fork";
      if (real[n.m]) cls += " real";
      var lab = E.monthLabel(n.m) + (n.log ? "：利益" + yen(n.log.profit) : "") + (n.fork ? "／ここで方向を変えた" : "");
      return opt.small ? '<span class="' + cls + '" title="' + esc(lab) + '"></span>' : '<button type="button" class="' + cls + '" data-act="cell" data-id="' + n.id + '" aria-label="' + esc(lab) + '">' + E.monthLabel(n.m).replace("月", "") + "</button>";
    }).join("") + "</div>";
  }
  function renderTimeline() { var t = $("#tl"); t.innerHTML = cellsHtml(E.path(G)); t.scrollLeft = t.scrollWidth; }

  function render() {
    E.ensureLive(G);
    renderHud(); renderBanner(); renderShop(); renderFlow(); renderTimeline();
    var h = $(".hud"), d = $(".dock");
    if (h) document.documentElement.style.setProperty("--hud-h", h.offsetHeight + "px");
    if (d) document.documentElement.style.setProperty("--dock-h", d.offsetHeight + "px");
  }

  // ---------- 重ねて出す画面 ----------
  function sheet(html, onMount) {
    var s = $("#sheet");
    s.innerHTML = '<div class="sheet-in" role="dialog" aria-modal="true">' + html + "</div>";
    s.hidden = false;
    var inner = s.querySelector(".sheet-in");
    if (onMount) onMount(inner);
    inner.scrollTop = 0;
    var f = inner.querySelector("button, input"); if (f) { try { f.focus({ preventScroll: true }); } catch (e) { } }
  }
  function closeSheet() { var s = $("#sheet"); s.hidden = true; s.innerHTML = ""; }

  function openSetup() {
    var roles = Object.keys(D.ROLES).map(function (k, i) { return '<label class="opt' + (i === 0 ? " on" : "") + '"><input type="radio" name="role" value="' + k + '"' + (i === 0 ? " checked" : "") + "><span>" + D.ROLES[k].label + "<small>" + D.ROLES[k].note + "</small></span></label>"; }).join("");
    var rules = D.STOP_RULES.map(function (r, i) { return '<label class="opt' + (i === 2 ? " on" : "") + '"><input type="radio" name="rule" value="' + r.id + '"' + (i === 2 ? " checked" : "") + "><span>" + r.l + "</span></label>"; }).join("");
    sheet("<h2>週末の焼き菓子を、始めてみる</h2>" +
      '<p class="lead">あなたは、お菓子を作るのが得意。週末に焼き菓子を作って、売ってみることにしました。1か月ずつ、値段・作る数・売る場所・時間の使い方を決めて、1年やってみます。</p>' +
      '<label class="field" for="f-name">お店の名前<input id="f-name" type="text" maxlength="20" placeholder="わたしの焼き菓子"></label>' +
      '<section><h3>いまの立場</h3><div class="opts">' + roles + "</div></section>" +
      '<section><h3>始める前に：何が起きたら、やめますか？</h3><div class="opts">' + rules + '</div><p class="hint">決めておくと、そのときにゲームが聞いてきます。</p></section>' +
      '<button class="btn pri wide" data-act="setup-go">始める</button>', function (s) {
        s.addEventListener("change", function () { Array.prototype.forEach.call(s.querySelectorAll(".opt"), function (o) { o.classList.toggle("on", o.querySelector("input").checked); }); });
      });
  }
  function setupGo() {
    var s = $("#sheet");
    G = E.newGame({ name: s.querySelector("#f-name").value, role: (s.querySelector('input[name="role"]:checked') || {}).value, rule: (s.querySelector('input[name="rule"]:checked') || {}).value });
    save(); openHowto(true); render();
  }
  function openHowto(first) {
    sheet("<h2>遊び方</h2><section>" +
      "<p>1か月に1回、<b>場面</b>（迷いどころ）が来ます。どれかを選ぶと、<b>今月の作戦</b>を決められます。</p>" +
      "<p>作戦は、1袋の値段・作る数・売る場所・今月やること（話を聞く・マルシェに出る・試作する など）。使える時間とお金には限りがあります。</p>" +
      "<p>「この作戦で1か月やってみる」を押すと、<b>帳簿</b>が返ってきます。売れた数、売れ残り、利益、時給換算と、なぜそうなったか。</p>" +
      "<p>だれが本当に買ってくれるのか、いくらまで払うのかは、<b>隠れています</b>。お客さんに聞くか、売ってみると、少しずつ分かります（仮説ボード）。</p>" +
      "<p>下の年表から、いつでも前の月に戻れます。12か月で、1年の決算です。やめるときは「今日はここまで」を押してください。</p></section>" +
      '<p class="hint">同じ月に同じ作戦なら、同じ結果になります。</p><button class="btn pri wide" data-act="close">' + (first ? "4月を始める" : "閉じる") + "</button>");
  }

  // 決算
  function openYear() {
    var s = E.summary(G);
    var p = E.path(G).filter(function (n) { return n.log; });
    var mx = Math.max.apply(null, p.map(function (n) { return Math.abs(n.log.profit); }).concat([1]));
    var bars = p.map(function (n) { return '<i class="' + (n.log.profit < 0 ? "neg" : "") + '" style="height:' + Math.max(2, Math.round(Math.abs(n.log.profit) / mx * 88)) + 'px" title="' + E.monthLabel(n.m) + " " + yen(n.log.profit) + '"></i>'; }).join("");
    var labs = p.map(function (n) { return "<span>" + E.monthLabel(n.m).replace("月", "") + "</span>"; }).join("");
    var k = s.known, kc = (k.who ? 1 : 0) + (k.job ? 1 : 0) + (k.wtp ? 1 : 0);
    var words = Object.keys(G.meta.words).map(function (id) { return E.word(id).w; }).join("・");
    var real = E.realDone(G);
    var nextL = { keep: "来年も、このまま続ける", change: "来年は、形を変えてみる", stop: "1年で区切りをつける" }[s.next] || (s.quit ? "途中で、やめると決めた" : "");
    sheet('<span class="hint">1年の決算</span><h2>' + esc(G.meta.name) + "の1年</h2>" +
      (real ? '<p class="bigline">この1年で、現実で<b>' + real + "回</b>動きました。</p>" : "") +
      '<section><h3>月ごとの利益</h3><div class="bars">' + bars + '</div><div class="bars-l">' + labs + "</div></section>" +
      "<section><h3>1年の帳簿</h3><p>売上 " + yen(s.revenue) + "・利益 " + yen(s.profit) + "・使った時間 " + Math.round(s.hours) + "時間・時給換算 " + yen(s.hourly) + "</p>" +
      "<p>作った " + s.made + "袋・売れた " + s.sold + "袋・売れ残り " + s.wasted + "袋・売り切れで買えなかった人 約" + s.missed + "袋分</p><p>常連さん " + s.reg + "人・元手 " + yen(s.cash) + "</p></section>" +
      "<section><h3>本当の答え</h3><p>いちばん買ってくれる人：<b>" + esc(s.truth.main) + "</b></p><p>その人の用事：<b>" + esc(s.truth.job) + "</b>（効く工夫：" + esc(s.truth.key) + "）</p><p>払ってもいい値段：<b>1袋 " + s.truth.wtp + "円</b>くらい（" + esc(s.truth.key) + "をつけると、" + s.truth.wtpKey + "円くらいまで）</p>" +
      '<p class="hint">あなたがたしかめられたのは、3つのうち' + kc + "つ。集めた声は、あったこと " + s.facts + "件・意見 " + s.opinions + "件でした。</p></section>" +
      (words ? "<section><h3>出会ったことば</h3><p>" + esc(words) + "</p></section>" : "") +
      (nextL ? "<section><h3>来年のつもり</h3><p>" + esc(nextL) + "</p></section>" : "") +
      '<section><h3>来年の自分に、ひとこと残しますか？</h3><label class="field" for="y-note"><span class="hint">書いたことは、この画面にまた出ます。</span><textarea id="y-note" maxlength="200">' + esc((G.meta.notes.slice(-1)[0] || {}).text || "") + "</textarea></label></section>" +
      '<div class="go"><button class="btn pri wide" data-act="year-save">ひとことを残す</button><button class="btn wide" data-act="restart">もう一度、ちがうやり方で始める</button><button class="btn ghost wide" data-act="routes">年表から戻って、別の道を試す</button><button class="btn ghost wide" data-act="close">閉じる</button></div>');
  }

  // 年表の1か月・別の道
  function openCell(id) {
    var n = G.nodes[id]; if (!n) return;
    var html = '<span class="hint">年表</span><h2>' + E.monthLabel(n.m) + "</h2>";
    if (n.fork) html += '<p class="hint">ここで方向を変えました（' + n.fork.n + "回目）。</p>";
    if (n.sceneDone) html += "<p>場面：" + esc(E.sceneTitle(G, E.sceneById(n.sceneId))) + " → " + esc(E.fill(n.sceneDone.label, G)) + "</p>";
    if (n.log) html += "<p>値段 " + n.log.price + "円・作った " + n.log.made + "袋・売れた " + n.log.sold + "袋・利益 " + yen(n.log.profit) + "</p>";
    else html += "<p>いまの月です。</p>";
    if (E.canRewind(G, id)) html += '<p class="hint">この月の初めに戻ります。いまの道は消えずに「別の道」に残ります。</p><button class="btn dark wide" data-act="rewind" data-id="' + id + '">この月の初めからやり直す</button>';
    html += '<button class="btn ghost wide" data-act="close">閉じる</button>';
    sheet(html);
  }
  function doRewind(id) {
    var r = E.rewind(G, id); if (!r) return;
    ui.sceneRes = null; closeSheet(); save(); render();
    note(E.monthLabel(r.m) + "の初めに戻りました。方向を変えたのは" + r.n + "回目です。");
    window.scrollTo(0, 0);
  }
  function openRoutes() {
    var rs = E.routes(G);
    var html = '<h2>年表と、別の道</h2><p class="lead">やり直した道も、消さずに並べています。どちらが良い・悪いは、ありません。</p><div class="routes">';
    rs.forEach(function (r) {
      var sum = 0; r.path.forEach(function (n) { if (n.log) sum += n.log.profit; });
      html += '<div class="route' + (r.current ? " cur" : "") + '"><div class="rh"><span>' + (r.current ? "いまの道" : r.fork ? r.fork.n + "回目に分かれた道" : "はじめの道") + "</span><span>" + E.monthLabel(r.end.m) + "まで・利益の合計 " + yen(sum) + "</span></div>" +
        cellsHtml(r.path, { small: true, dimBefore: r.fork ? r.forkM : undefined }) +
        (r.current ? "" : '<button class="btn" data-act="switch" data-id="' + r.leaf + '">この道の続きを遊ぶ</button>') + "</div>";
    });
    sheet(html + '</div><button class="btn ghost wide" data-act="close">閉じる</button>');
  }
  function openWords() {
    var got = G.meta.words;
    sheet("<h2>ことば</h2><p class=\"lead\">" + Object.keys(got).length + " / " + D.WORDS.length + "。迷ったり、うまくいったりした場面で、その名前として出会います。</p><div class=\"dex\">" +
      D.WORDS.map(function (w) { return got[w.id] ? '<div class="dx"><b>' + esc(w.w) + "</b><p>" + esc(w.m) + '</p><span class="hint">' + E.monthLabel(got[w.id].m) + "に出会った</span></div>" : '<div class="dx off"><b>？？？</b></div>'; }).join("") +
      '</div><button class="btn ghost wide" data-act="close">閉じる</button>');
  }

  // 今日はここまで
  var draft = null;
  function suggestions() {
    var S = E.ensureLive(G), facts = S.quotes.filter(function (q) { return q.kind === "fact"; }).length, out = [];
    out.push({ kind: "ask", text: "身近な1人に「最近、おやつ（手みやげ）をどうしていますか？」と、あったことを聞く" });
    if (S.feat.label || S.feat.wrap || S.feat.flavor) out.push({ kind: "make", text: "自分の得意なもので、いちばん小さな試作品を1つ作って、1人に見せる" });
    else out.push({ kind: "make", text: "自分の得意なもので、いちばん小さな形を1つ作って、1人に見せる" });
    out.push({ kind: "quit", text: "なんとなく続けていることを1つ、今週だけやめて、時間を空ける" });
    return { list: out, facts: facts };
  }
  function openExit() {
    var sg = suggestions(), t = G.meta.session.tries || 0;
    var lead = t > 0 ? "今日、ゲームの中で、話を聞く・マルシェに出る・試作するを、あわせて" + t + "回選びましたね。" : "今日は、ゲームの中で、話を聞く・試すを選びませんでしたね。";
    var opts = sg.list.map(function (s, i) { return '<label class="opt"><input type="radio" name="rk" value="' + i + '"><span>' + esc(s.text) + "</span></label>"; }).join("") + '<label class="opt"><input type="radio" name="rk" value="own"><span>自分で決める</span></label>';
    sheet('<h2>今日はここまで</h2><p class="lead">' + esc(lead) + "</p><section><h3>現実で、今週ひとつだけ試すなら、何にしますか？</h3>" + (sg.facts ? '<p class="hint">ゲームの中で「あったことを聞く」を' + sg.facts + "回しました。現実でも、同じ聞き方ができます。</p>" : "") +
      '<div class="opts">' + opts + '</div><label class="field" for="x-text">くわしく（だれに・何を。書かなくてもいい）<input id="x-text" type="text" maxlength="80"></label></section>' +
      '<div class="row"><button class="btn pri" data-act="exit2">次へ</button><button class="btn ghost" data-act="close">まだ続ける</button></div>', function (s) {
        s.addEventListener("change", function () { Array.prototype.forEach.call(s.querySelectorAll(".opt"), function (o) { o.classList.toggle("on", o.querySelector("input").checked); }); });
      });
  }
  function exit2() {
    var s = $("#sheet"), v = (s.querySelector('input[name="rk"]:checked') || {}).value, txt = s.querySelector("#x-text").value.trim();
    if (v === undefined) { if (!s.querySelector(".warnbox")) s.querySelector(".opts").insertAdjacentHTML("afterend", '<p class="warnbox">1つ選んでください。思いつかないときは「自分で決める」に、いま思いついたことを書いてください。</p>'); return; }
    if (v === "own" && !txt) { s.querySelector("#x-text").focus(); return; }
    var sg = suggestions().list;
    draft = v === "own" ? { kind: "own", text: txt } : { kind: sg[+v].kind, text: sg[+v].text + (txt ? "（" + txt + "）" : "") };
    sheet("<h2>今週の一手</h2><p class=\"note-prev\">" + esc(draft.text) + '</p><section><h3>それを、何が起きたらやめますか？</h3><div class="opts">' +
      D.REAL_STOPS.map(function (l, i) { return '<label class="opt"><input type="radio" name="rs" value="' + i + '"><span>' + l + "</span></label>"; }).join("") +
      '</div><label class="field" for="x-stop">自分で決めるとき<input id="x-stop" type="text" maxlength="60"></label></section><div class="row"><button class="btn pri" data-act="exit3">決めて、今日は終わる</button><button class="btn ghost" data-act="close">まだ続ける</button></div>', function (s2) {
        s2.addEventListener("change", function () { Array.prototype.forEach.call(s2.querySelectorAll(".opt"), function (o) { o.classList.toggle("on", o.querySelector("input").checked); }); });
      });
  }
  function exit3() {
    var s = $("#sheet"), i = (s.querySelector('input[name="rs"]:checked') || {}).value, own = s.querySelector("#x-stop").value.trim();
    var stop = i === undefined ? (own || "決めていない") : (+i === 3 ? (own || "自分で決める") : D.REAL_STOPS[+i]);
    var it = E.addReal(G, { kind: draft.kind, text: draft.text, stop: stop });
    G.meta.session = { at: Date.now(), tries: 0, turns: 0 };
    save();
    sheet("<h2>今週の一手を決めました</h2><p class=\"note-prev\">" + esc(it.text) + '</p><p class="hint">やめる条件：' + esc(stop) + "</p><p>次に開いたとき、どうだったか聞かせてください。やらなかったとしても、責めたりしません。</p>" +
      '<label class="field" for="x-copy">手帳やメモに写すとき<textarea id="x-copy" readonly>' + esc("今週の一手：" + it.text + "\nやめる条件：" + stop) + '</textarea></label><div class="row"><button class="btn" data-act="copy">写す（コピー）</button><button class="btn pri" data-act="exit-done">閉じる</button></div>');
  }
  var queue = [];
  function openReturn() {
    var it = queue[0]; if (!it) { closeSheet(); render(); return; }
    var d = new Date(it.at);
    sheet('<span class="hint">おかえりなさい</span><h2>前回の一手は、どうなりましたか？</h2><p class="note-prev">' + esc(it.text) + '</p><p class="hint">' + (d.getMonth() + 1) + "月" + d.getDate() + "日に決めたこと／やめる条件：" + esc(it.stop || "") + '</p><div class="opts"><button class="btn pri wide" data-act="ret" data-v="done">やった</button><button class="btn wide" data-act="ret" data-v="partial">途中</button><button class="btn wide" data-act="ret" data-v="notyet">やらなかった</button></div>');
  }
  function doReturn(v) {
    var it = queue.shift(); E.resolveReal(G, it.id, v); save();
    var msg = v === "done" ? "現実で動いた分、ゲームの中でも、お客さんのことが少し見えるようになりました（仮説ボード）。年表にも残ります。" : v === "partial" ? "そのままにしておきます。次にまた聞きます。" : "また今度でいいです。";
    sheet("<h2>" + (v === "done" ? "やりましたね" : v === "partial" ? "途中ですね" : "わかりました") + "</h2><p>" + msg + '</p><button class="btn pri wide" data-act="ret-next">' + (queue.length ? "次の一手へ" : "続きを遊ぶ") + "</button>");
  }
  function openMenu() {
    sheet('<h2>メニュー</h2><div class="opts"><button class="btn wide" data-act="howto">遊び方</button><button class="btn wide" data-act="hyp">仮説ボード</button><button class="btn wide" data-act="words">ことば</button><button class="btn wide" data-act="routes">年表と、別の道</button>' +
      (E.finished(G) ? '<button class="btn wide" data-act="year">1年の決算</button>' : "") +
      '<button class="btn ghost wide" data-act="reset">最初からはじめる</button></div><p class="hint">データは、この端末のブラウザに保存しています。</p><button class="btn ghost wide" data-act="close">閉じる</button>');
  }

  // ---------- 操作 ----------
  function plan() { return E.ensureLive(G).plan; }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
    var a = b.getAttribute("data-act"), S = G ? E.ensureLive(G) : null, p = S ? S.plan : null;
    switch (a) {
      case "scene":
        ui.sceneRes = E.resolveScene(G, +b.getAttribute("data-i"));
        var mods = S.mods || {};
        if (mods.big) p.make = Math.min(400, p.make + mods.big);
        if (mods.market) { /* 今月は誘いで出る */ }
        save(); render(); break;
      case "p-": p.price = Math.max(200, p.price - 50); renderFlow(); break;
      case "p+": p.price = Math.min(900, p.price + 50); renderFlow(); break;
      case "m-": p.make = Math.max(0, p.make - 10); renderFlow(); break;
      case "m+": p.make = Math.min(400, p.make + 10); renderFlow(); break;
      case "ch": var c = b.getAttribute("data-ch"); p.ch[c] = !p.ch[c]; renderFlow(); break;
      case "act":
        var x = b.getAttribute("data-a"); p.acts = p.acts || [];
        var i = p.acts.indexOf(x); if (i >= 0) p.acts.splice(i, 1); else p.acts.push(x);
        if (x === "interview" && i < 0) p.interviews = [{ ch: "work", ask: null }, { ch: "friends", ask: null }];
        if (x === "trial" && i < 0) p.trial = null;
        renderFlow(); break;
      case "iv-ch": var k = +b.getAttribute("data-k"); p.interviews[k] = p.interviews[k] || {}; p.interviews[k].ch = b.getAttribute("data-ch"); renderFlow(); break;
      case "iv-ask": var k2 = +b.getAttribute("data-k"); p.interviews[k2] = p.interviews[k2] || {}; p.interviews[k2].ask = b.getAttribute("data-ask"); renderFlow(); break;
      case "trial": p.trial = b.getAttribute("data-f"); renderFlow(); break;
      case "help": p.helperUse = !p.helperUse; renderFlow(); break;
      case "kitchen": p.kitchenUse = !p.kitchenUse; renderFlow(); break;
      case "run":
        var r = E.run(G); if (r) { ui.sceneRes = null; save(); render(); window.scrollTo(0, 0); }
        break;
      case "next": if (E.next(G)) { save(); render(); window.scrollTo(0, 0); } break;
      case "redo": doRewind(G.cur); break;
      case "year": openYear(); break;
      case "year-save":
        var t = ($("#y-note") || {}).value || "";
        if (t.trim()) { G.meta.notes.push({ text: t.trim().slice(0, 200), at: Date.now() }); save(); }
        b.textContent = "残しました"; break;
      case "restart":
        var keep = G.meta; G = E.newGame({ name: keep.name, role: keep.role, rule: keep.rule });
        G.meta.notes = keep.notes; G.meta.real = keep.real; G.meta.forks = keep.forks;
        ui.sceneRes = null; save(); closeSheet(); render(); note("もう一度、4月から。お客さんの答えは、前とはちがうかもしれません。"); break;
      case "cell": openCell(b.getAttribute("data-id")); break;
      case "rewind": doRewind(b.getAttribute("data-id")); break;
      case "routes": openRoutes(); break;
      case "switch": E.switchRoute(G, b.getAttribute("data-id")); ui.sceneRes = null; save(); closeSheet(); render(); break;
      case "words": openWords(); break;
      case "hyp": openHyp(); break;
      case "howto": openHowto(false); break;
      case "menu": openMenu(); break;
      case "exit": openExit(); break;
      case "exit2": exit2(); break;
      case "exit3": exit3(); break;
      case "copy": try { navigator.clipboard.writeText($("#x-copy").value).then(function () { b.textContent = "コピーしました"; }, function () { b.textContent = "選んで写してください"; }); } catch (er) { b.textContent = "選んで写してください"; } break;
      case "exit-done": closeSheet(); ui.resting = true; render(); break;
      case "resume": ui.resting = false; render(); break;
      case "ret": doReturn(b.getAttribute("data-v")); break;
      case "ret-next": openReturn(); break;
      case "setup-go": setupGo(); break;
      case "reset": sheet('<h2>最初からはじめる</h2><p>いまのデータ（年表・ことば・現実の一手の記録）は消えます。</p><div class="row"><button class="btn dark" data-act="reset-go">消して、最初から</button><button class="btn ghost" data-act="close">やめる</button></div>'); break;
      case "reset-go": try { localStorage.removeItem(KEY); } catch (er) { } G = null; ui = { sceneRes: null, warned: false, resting: false }; closeSheet(); openSetup(); break;
      case "close": closeSheet(); if (G) render(); break;
    }
  });
  window.addEventListener("resize", function () { if (G) render(); });

  function boot() {
    G = load();
    if (!G) { openSetup(); return; }
    E.ensureLive(G);
    var now = Date.now();
    if (now - (G.meta.lastActive || 0) > 2 * 3600 * 1000) G.meta.session = { at: now, tries: 0, turns: 0 };
    queue = E.pendingReal(G).filter(function (r) { return r.at < G.meta.session.at || now - r.at > 2 * 3600 * 1000; }).slice(0, 3);
    render();
    if (queue.length) openReturn();
  }
  boot();
})();

</script>
</body>
</html>
