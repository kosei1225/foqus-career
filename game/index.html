<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>わたし株式会社</title>
<meta name="description" content="自分を1つの会社に見立てて、1か月ずつ経営するゲーム。">
<meta name="robots" content="noindex, nofollow">
<style>
/* Layout: 帳簿のようなダッシュボード。上に4つの数字、真ん中にオフィスと今月のカード、下に年表。
   ベージュの紙・深緑・蛍光グリーン（差し色は「これにする」と現実の記録だけ）。角は4pxまで、影・グラデーションなし */
:root {
  color-scheme: light;
  --paper: #EFEDE4;
  --sheet: #FFFFFF;
  --ink: #1C2B22;
  --muted: #6E7A72;
  --line: #D8D4C8;
  --deep: #16301F;
  --pop: #00D959;
  --warn: #C77B3A;
  --floor: #E4E1D6;
  --sky: #F4F5EF;
  --on-ink: #FFFFFF;
  --f-head: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "BIZ UDPMincho", serif;
  --f-body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic", "Noto Sans JP", "Meiryo", sans-serif;
  --hud-h: 124px;
  --dock-h: 104px;
  --r: 4px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 600; line-height: 1.45; text-wrap: balance; }
h1, h2 { font-family: var(--f-head); }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--deep); outline-offset: 2px; }

/* ---------- 上：4つの数字 ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--sheet); }
.hud { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 20; background: var(--sheet); border-bottom: 1px solid var(--line); }
.hud-in { max-width: 560px; margin: 0 auto; padding-block: 8px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hud-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.hud-top .co { font-family: var(--f-head); font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hud-top .mo { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }
.stats { display: grid; gap: 1px; }
.st { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) 4.6em 2.6em; align-items: center; gap: 8px; height: 20px; font-size: 13px; }
.st .lab { font-weight: 700; }
.st .dots { display: flex; gap: 3px; min-width: 0; }
.st .dots i { width: 11px; height: 11px; border: 1.2px solid var(--ink); border-radius: 50%; flex: none; }
.st .dots i.on { background: var(--ink); }
.st.axis .dots i { border-radius: 1px; }
.st .val { text-align: right; font-weight: 700; white-space: nowrap; }
.st .dl { font-size: 12px; font-weight: 700; color: var(--deep); opacity: 0; transition: opacity .25s; white-space: nowrap; }
.st .dl.show { opacity: 1; }
.st .dl.neg { color: var(--warn); }
.st.warn .lab, .st.warn .val { color: var(--warn); }
.st.warn .dots i { border-color: var(--warn); }
.st.warn .dots i.on { background: var(--warn); }
.st .sub { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 4px; }
@media (prefers-reduced-motion: reduce) { .st .dl { transition: none; } }

/* ---------- 真ん中 ---------- */
main { max-width: 560px; margin: 0 auto; padding-top: calc(var(--hud-h) + env(safe-area-inset-top, 0px) + 10px); padding-bottom: calc(var(--dock-h) + env(safe-area-inset-bottom, 0px) + 16px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 12px; }
.banner { font-size: 13px; line-height: 1.6; color: var(--muted); display: grid; gap: 2px; }
.banner b { color: var(--ink); }
.banner .real b { color: var(--deep); }
.office { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.office svg { display: block; width: 100%; height: auto; }
.office-cap { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 6px 10px 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.office-cap b { color: var(--ink); font-weight: 700; }

.stage { display: grid; gap: 10px; }
.stage-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.stage-h h2 { font-size: 17px; }
.stage-h small { font-size: 12px; color: var(--muted); }

/* カード */
.card { display: grid; gap: 6px; width: 100%; text-align: left; padding: 12px 14px; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; }
.card:hover { border-color: var(--muted); }
.card.sel { border: 2px solid var(--deep); padding: 11px 13px; }
.card .ctop { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 2px; font-size: 12px; font-weight: 700; line-height: 1.6; }
.ty-keep .chip.ty { background: var(--line); color: var(--ink); }
.ty-try .chip.ty { background: var(--muted); color: var(--on-ink); }
.ty-bet .chip.ty { background: var(--ink); color: var(--on-ink); }
.ty-bet { border-color: var(--muted); }
.card .dirtag { color: var(--muted); }
.card .chance { margin-left: auto; font-weight: 700; }
.card h3 { font-size: 16px; }
.card .cd { font-size: 13px; color: var(--muted); line-height: 1.6; }
.card .cmeta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; border-top: 1px dashed var(--line); padding-top: 6px; }
.card .cmeta .cost { font-weight: 700; }
.card .cmeta .gain { color: var(--deep); }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 10px 18px; border-radius: var(--r); border: 1px solid var(--ink); background: var(--sheet); font-weight: 700; cursor: pointer; text-align: center; }
.btn.pri { background: var(--pop); border-color: var(--pop); color: var(--ink); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.btn.ghost { border-color: var(--line); background: transparent; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.go { display: grid; gap: 8px; }
.linkish { background: none; border: 0; padding: 4px 0; font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; justify-self: start; }

/* 出来事・結果 */
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.panel.evt { border-left: 4px solid var(--muted); }
.panel.evt.good { border-left-color: var(--deep); }
.panel.evt.bad { border-left-color: var(--warn); }
.panel .kicker { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.panel h3 { font-size: 17px; font-family: var(--f-head); }
.panel .txt { font-size: 14px; }
.choices { display: grid; gap: 8px; }
.deltas { display: flex; flex-wrap: wrap; gap: 6px; }
.deltas span { font-size: 12px; font-weight: 700; padding: 2px 8px; border: 1px solid var(--line); border-radius: 2px; }
.deltas span.up { border-color: var(--deep); color: var(--deep); }
.deltas span.down { border-color: var(--warn); color: var(--warn); }
.notes { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.wordget { border: 1px solid var(--ink); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 2px; }
.wordget .k { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.wordget b { font-family: var(--f-head); font-size: 17px; }
.wordget p { font-size: 13px; }
.redo { font-size: 12px; color: var(--muted); }

/* 続けていること・賭け */
.side { display: grid; gap: 8px; }
.side h2 { font-size: 15px; }
.stocks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.stk { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; font-size: 12px; min-width: 0; }
.stk b { display: block; font-size: 13px; }
.stk .lv { display: flex; gap: 2px; margin: 3px 0; }
.stk .lv i { width: 14px; height: 5px; background: var(--line); }
.stk .lv i.on { background: var(--deep); }
.betbox { background: var(--sheet); border: 1.5px solid var(--ink); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 6px; font-size: 13px; }
.betbox .bar { display: flex; gap: 2px; }
.betbox .bar i { flex: 1; height: 6px; background: var(--line); }
.betbox .bar i.on { background: var(--ink); }
.empty { font-size: 13px; color: var(--muted); }

/* ---------- 下：年表とメニュー ---------- */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--sheet); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock-in { max-width: 560px; margin: 0 auto; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.tl { overflow-x: auto; overflow-y: hidden; padding-block: 8px 4px; scrollbar-width: thin; }
.tl-row { display: flex; align-items: flex-end; gap: 2px; min-width: min-content; }
.tl .yr { display: grid; gap: 2px; margin-right: 6px; }
.tl .yr-l { font-size: 10px; color: var(--muted); line-height: 1; height: 10px; white-space: nowrap; }
.tl .cells { display: flex; gap: 2px; }
.tl .c { position: relative; width: 13px; height: 22px; border-radius: 1px; background: var(--paper); border: 1px solid var(--line); padding: 0; cursor: pointer; flex: none; }
.tl .c.keep { background: var(--line); border-color: var(--line); }
.tl .c.try { background: var(--muted); border-color: var(--muted); }
.tl .c.bet { background: var(--ink); border-color: var(--ink); }
.tl .c.now { background: var(--sheet); border: 2px solid var(--deep); }
.tl .c.real::after { content: ""; position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: var(--pop); }
.tl .c.real { background: var(--deep); border-color: var(--deep); }
.tl .c.fork::before { content: ""; position: absolute; left: -3px; top: -7px; width: 7px; height: 5px; border-left: 1.5px solid var(--deep); border-top: 1.5px solid var(--deep); }
.tl .c.inbet { box-shadow: none; }
.tl .c .bl { position: absolute; left: -1px; right: -3px; bottom: -5px; height: 2px; background: var(--ink); }
.nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding-block: 2px 6px; }
.nav button { min-height: 40px; border: 0; background: none; font-size: 12px; font-weight: 700; cursor: pointer; border-radius: var(--r); padding: 4px 2px; line-height: 1.3; }
.nav button:hover { background: var(--paper); }
.nav button.exit { color: var(--deep); }

/* ---------- 重ねて出す画面 ---------- */
.sheet { position: fixed; inset: 0; z-index: 40; background: rgba(28, 43, 34, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet[hidden] { display: none !important; }
.sheet-in { width: 100%; max-width: 560px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); overflow: auto; background: var(--paper); border-radius: var(--r) var(--r) 0 0; padding-block: 18px calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; align-content: start; }
@media (min-width: 620px) { .sheet { align-items: center; } .sheet-in { border-radius: var(--r); max-height: calc(100% - 48px); } }
.sheet-in h2 { font-size: 20px; }
.sheet-in .lead { font-size: 14px; color: var(--muted); }
.sheet-in section { display: grid; gap: 8px; }
.sheet-in h3 { font-size: 15px; }
.opts { display: grid; gap: 6px; }
.opt { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; font-size: 14px; line-height: 1.55; }
.opt input { margin-top: 3px; accent-color: var(--deep); width: 18px; height: 18px; flex: none; }
.opt.on { border-color: var(--deep); }
.opt small { display: block; color: var(--muted); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--sheet); border-radius: 2px; padding: 6px 10px; font-size: 13px; cursor: pointer; min-height: 36px; }
.chips button[aria-pressed="true"] { border-color: var(--deep); background: var(--deep); color: var(--on-ink); }
.field { display: grid; gap: 4px; font-size: 13px; font-weight: 700; }
.field input, .field textarea { font: inherit; font-weight: 400; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--sheet); color: var(--ink); width: 100%; }
.field textarea { min-height: 84px; resize: vertical; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row .btn { flex: 1 1 140px; }
.hint { font-size: 12px; color: var(--muted); line-height: 1.6; }
.warnbox { border: 1px solid var(--warn); color: var(--ink); background: var(--sheet); border-radius: var(--r); padding: 10px 12px; font-size: 13px; }

/* 決算 */
.cmp { display: grid; gap: 6px; }
.cmp-row { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: center; font-size: 13px; }
.cmp-row b { font-weight: 700; }
.cmp-bar { display: flex; align-items: center; gap: 6px; min-width: 0; }
.cmp-bar i { display: block; height: 8px; background: var(--muted); }
.cmp-bar.now i { background: var(--ink); }
.cmp-bar span { font-size: 12px; white-space: nowrap; }
.ratio { display: flex; height: 16px; border: 1px solid var(--line); }
.ratio i { display: block; height: 100%; }
.ratio .keep { background: var(--line); } .ratio .try { background: var(--muted); } .ratio .bet { background: var(--ink); }
.yl { display: grid; gap: 2px; font-size: 13px; max-height: 220px; overflow: auto; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; }
.yl div { display: grid; grid-template-columns: 3.2em 3.2em minmax(0, 1fr); gap: 6px; }
.yl .t { font-size: 11px; font-weight: 700; }
.bigline { font-family: var(--f-head); font-size: 18px; }
.bigline b { color: var(--deep); }
.note-prev { background: var(--sheet); border-left: 3px solid var(--deep); padding: 10px 12px; font-size: 14px; }

/* 図鑑 */
.dex { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.dx { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; min-height: 86px; display: grid; align-content: start; gap: 2px; min-width: 0; }
.dx .no { font-size: 11px; color: var(--muted); font-weight: 700; }
.dx b { font-family: var(--f-head); font-size: 15px; }
.dx p { font-size: 12px; line-height: 1.5; }
.dx .when { font-size: 11px; color: var(--muted); }
.dx.off b { color: var(--line); font-size: 20px; letter-spacing: .1em; }

/* 別の道 */
.routes { display: grid; gap: 10px; }
.route { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 6px; }
.route.cur { border-color: var(--deep); }
.route .rh { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; flex-wrap: wrap; }
.route .rs { overflow-x: auto; }
.route .rs .tl-row { gap: 2px; }
.route .rs .c { width: 9px; height: 14px; cursor: default; }
.route .end { font-size: 12px; color: var(--muted); }
.route .c.ghost { visibility: hidden; }
.reallist { display: grid; gap: 6px; }
.realitem { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; font-size: 13px; display: grid; gap: 2px; }
.realitem .s { font-size: 11px; font-weight: 700; color: var(--muted); }
.realitem.done { border-color: var(--deep); }
.realitem.done .s { color: var(--deep); }
textarea.code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; min-height: 140px; }

.rest { min-height: 60vh; display: grid; place-items: center; text-align: center; gap: 14px; padding-block: 40px; }
.rest h2 { font-size: 22px; }
.rest p { color: var(--muted); font-size: 14px; }

@media (min-width: 720px) {
  body { font-size: 15px; }
  .stocks { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .dex { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* オフィスの図（線と形だけ） */
.o-wall { fill: var(--sheet); } .o-floor { fill: var(--floor); } .o-ln { stroke: var(--line); stroke-width: 1; }
.o-sky { fill: var(--sky); } .o-hill, .o-bld, .o-sun { fill: none; stroke: var(--muted); stroke-width: 1.1; }
.o-mul { stroke: var(--ink); stroke-width: 1; }
.o-frame { stroke: var(--ink); stroke-width: 1.5; } .o-none { fill: none; } .o-white { fill: var(--sheet); }
.o-ink { fill: var(--ink); } .o-muted { fill: var(--muted); } .o-deep { fill: var(--deep); } .o-paper { fill: var(--paper); }
.o-t1 { fill: var(--on-ink); font-size: 7px; font-family: var(--f-body); }
.o-t2 { fill: var(--muted); font-size: 7px; font-family: var(--f-body); }
.o-tally { stroke: var(--ink); stroke-width: 1.2; }
.o-board { fill: var(--paper); stroke: var(--deep); stroke-width: 1.2; } .o-pin { fill: var(--deep); }
.o-frame2 { fill: var(--sheet); stroke: var(--muted); stroke-width: 1.2; } .o-ln2 { stroke: var(--muted); stroke-width: 1.2; }
.o-leaf { stroke: var(--deep); stroke-width: 1.6; }
.o-chair { fill: var(--paper); stroke: var(--muted); stroke-width: 1; } .o-leg { stroke: var(--ink); stroke-width: 1.5; }
.o-plate { fill: var(--deep); }
.o-table, .o-counter { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
.o-dark { fill: var(--ink); }

/* 選んだカードの確定（下に固定） */
.confirm { border-bottom: 1px solid var(--line); background: var(--sheet); }
.confirm[hidden] { display: none !important; }
.confirm-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.confirm .cf-t { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.confirm .cf-t .hint { margin-right: 6px; font-weight: 700; }
.confirm .btn { flex: none; min-height: 44px; }

.st .dots .sc { font-size: 10px; color: var(--muted); margin-left: 4px; white-space: nowrap; align-self: center; }
.tl .c.fork::before { left: -1px; right: -1px; top: -6px; width: auto; height: 3px; border: 0; background: var(--deep); }
.route .c.shared { opacity: .3; }

</style>
</head>
<body>
<header class="hud"><div class="hud-in"><div class="hud-top"><span class="co" id="co">わたし株式会社</span><span class="mo num" id="mo"></span></div><div class="stats" id="stats" role="group"></div></div></header>
<main>
  <div class="banner" id="banner"></div>
  <section class="office" id="office" aria-label="オフィス"></section>
  <section class="stage" id="stage" aria-live="polite"></section>
  <section class="side" id="side"></section>
</main>
<footer class="dock"><div class="confirm" id="confirm" hidden></div><div class="dock-in">
  <div class="tl" id="tl" aria-label="年表"></div>
  <nav class="nav" aria-label="メニュー">
    <button type="button" data-act="nav-routes">年表と<br>別の道</button>
    <button type="button" data-act="nav-dex">ことば<br>図鑑</button>
    <button type="button" class="exit" data-act="nav-exit">今日は<br>ここまで</button>
    <button type="button" data-act="nav-menu">メニュー</button>
  </nav>
</div></footer>
<div class="sheet" id="sheet" hidden></div>
<script>
/* わたし株式会社：ゲームの中身（カード・出来事・ことば）。
   表示する文はすべてここ。数値の意味は engine.js の先頭のコメントを参照。 */
(function (root) {
  var D = (root.WK = root.WK || {}).DATA = {};

  // ---------------- 向き（軸の方向） ----------------
  D.DIRS = {
    deepen: "深める", make: "つくる", connect: "つなぐ", learn: "学ぶ", move: "動く"
  };

  // ---------------- 立場 ----------------
  D.ROLES = {
    student: { label: "学生", work: "student", H: 2, M: 1, K: 3, A: 10 },
    employee: { label: "会社などで働いている", work: "employee", H: 3, M: 2, K: 6, A: 10 },

      for (var e2 = 0; e2 < S.bet.dur; e2++) {

        o.push('<rect class="' + (e2 < S.bet.el ? "o-ink" : "o-paper") + '" x="' + (bx + 2 + e2 * cw).toFixed(1) + '" y="' + (byy + 4) + '" width="' + Math.max(1, cw - 1).toFixed(1) + '" height="6"/>');
      }

      [18, 37].forEach(function (py) { o.push('<line class="o-tally" x1="' + ux + '" y1="' + (uy + py) + '" x2="' + (ux + 46) + '" y2="' + (uy + py) + '"/>'); });
      for (var it = 0; it < 15; it++) {
        var idx = u * 15 + it; if (idx >= items) break;
        var row = Math.floor(it / 5), col = it % 5, ih = 7 + ((idx * 5) % 4);

      o.push('<line class="o-leg" x1="' + (dx + 3) + '" y1="154" x2="' + (dx + 3) + '" y2="172"/><line class="o-leg" x1="' + (dx + 37) + '" y1="154" x2="' + (dx + 37) + '" y2="172"/>');

    if (S.stocks.role) o.push('<rect class="o-plate" x="' + (deskX(0) + 2) + '" y="146" width="' + (8 + S.stocks.role * 2) + '" height="4"/>');

      var px = deskX(di) + 20 + (lap === 0 ? 0 : (lap % 2 ? -14 : 14) * Math.ceil(lap / 2));
      var py = lap === 0 ? 139 : 137;
      if (px > 296 && hasBiz) continue;
      o.push('<circle class="' + (pp === 0 ? "o-ink" : "o-muted") + '" cx="' + px + '" cy="' + py + '" r="' + (pp === 0 ? 5 : 4) + '"/>');
      placed++;
    }
    if (H > 20) o.push('<text class="o-t2" x="290" y="178" text-anchor="end">ほか' + (H - 20) + "人</text>");
    // カネが減ると暗くなる
    var dark = K >= 6 ? 0 : K >= 3 ? 0.07 : K > 0.05 ? 0.15 : 0.26;
    if (dark) o.push('<rect class="o-dark" x="0" y="0" width="360" height="180" fill-opacity="' + dark + '"/>');
    return '<svg viewBox="0 0 360 180" role="img" aria-label="' + esc(G.meta.name) + 'のオフィス。机' + desks + "つ、人" + H + "人、棚に" + M + "つ、窓の大きさは軸" + A + '">' + o.join("") + "</svg>";
  }
  function renderOffice() {
    var S = E.ensureLive(G);
    var cap = S.m < 4
      ? "<span>ヒトが増えると<b>机と人</b>が、モノが増えると<b>棚</b>が増えます。カネが減ると<b>部屋が暗く</b>、軸が上がると<b>窓が大きく</b>なります。</span>"
      : "<span>机<b>" + Math.min(6, 1 + Math.floor(S.H / 4)) + "</b></span><span>人<b>" + S.H + "</b></span><span>棚の品<b>" + S.M + "</b></span><span>窓<b>" + S.A + "</b></span>" +
        (E.realDone(G) ? "<span>現実のピン<b>" + E.realDone(G) + "</b></span>" : "");
    $("#office").innerHTML = office(S) + '<div class="office-cap">' + cap + "</div>";
  }

  // ---------- 今月 ----------
  function deltaChips(d) {
    var out = [];
    if (!d) return "";
    if (d.H) out.push('<span class="' + (d.H > 0 ? "up" : "down") + '">ヒト' + sign(d.H) + "</span>");
    if (d.M) out.push('<span class="' + (d.M > 0 ? "up" : "down") + '">モノ' + sign(d.M) + "</span>");
    if (d.K) out.push('<span class="' + (d.K > 0 ? "up" : "down") + '">カネ' + sign(d.K, "か月") + "</span>");
    if (d.A) out.push('<span class="' + (d.A > 0 ? "up" : "down") + '">軸' + sign(d.A) + "</span>");
    return out.length ? '<div class="deltas">' + out.join("") + "</div>" : "";
  }
  function wordCards(ids) {
    return (ids || []).map(function (id) {
      var w = E.word(id); if (!w) return "";
      return '<div class="wordget"><span class="k">ことばを獲得</span><b>' + esc(w.w) + "</b><p>" + esc(w.m) + "</p></div>";
    }).join("");
  }
  function stockLines(st) {
    return (st || []).map(function (s) {
      return "<p>「" + D.STOCKS[s.key].label + "」が" + (s.from ? s.to + "段に育った。" : "始まった。") + "</p>";
    }).join("");
  }
  var TYL = { keep: "守る", try: "試す", bet: "賭ける" };
  function cardHtml(v, sel) {
    var cost;
    if (v.id === "focus") cost = "カネ −" + fk(v.cost) + "か月";
    else if (v.ty === "bet") cost = "カネ −" + fk(v.cost) + "か月＋毎月−" + fk(v.mc) + "か月";
    else cost = v.cost ? "カネ −" + fk(v.cost) + "か月" : "カネ ±0";
    var chance = v.id === "focus" ? "見込みが少し近づく" : v.ty === "bet" ? "見込み " + v.chance + "%（6か月）" : "見込み " + v.chance + "%";
    var gains = v.id === "focus" ? "「" + esc(v.focusOf || "") + "」の手ごたえ" : v.gains.length ? v.gains.join("・") : "いつも通りの1か月";
    return '<button type="button" class="card ty-' + v.ty + (sel ? " sel" : "") + '" data-act="pick" data-id="' + v.id + '" aria-pressed="' + (sel ? "true" : "false") + '">' +
      '<div class="ctop"><span class="chip ty">' + TYL[v.ty] + "</span>" + (v.dir ? '<span class="dirtag">' + v.dir + "</span>" : "") + '<span class="chance num">' + chance + "</span></div>" +
      "<h3>" + esc(v.t) + '</h3><p class="cd">' + esc(v.d) + "</p>" +
      '<div class="cmeta"><span class="cost num">' + cost + '</span><span class="gain">増えるかも：' + gains + "</span></div></button>";
  }
  function renderStage() {
    var S = E.ensureLive(G), n = E.node(G), st = $("#stage"), html = "";
    renderConfirm(null);
    if (ui.resting) { st.innerHTML = restHtml(); return; }
    // やめる条件に触れた
    var stop = E.pendingStop(G);
    if (stop) {
      var bc = E.card(S.bet.id);
      var cl = D.STOP_CONDS.filter(function (c) { return c.id === stop; })[0];
      html += resultHtml() +
        '<div class="panel evt bad"><span class="kicker">決めておいた、やめる条件</span><h3>' + esc(cl.l.replace(/たら$/, "た")) + "</h3>" +
        '<p class="txt">「' + esc(bc.t) + "」を始めるときに決めた条件に、触れました。やめますか？</p>" +
        '<p class="hint">やめる：使ったカネは戻りませんが、経験がモノとして残ります（モノ+1）。<br>続ける：このまま毎月、カネが減っていきます。</p>' +
        '<div class="row"><button class="btn dark" data-act="stop-quit">やめる</button><button class="btn" data-act="stop-cont">続ける</button></div></div>';
      st.innerHTML = html; return;
    }
    if (n.log) {
      st.innerHTML = resultHtml() + nextHtml(); return;
    }
    var ev = E.eventFor(G);
    if (ev && !n.evtDone) {
      var tone = { good: "良いこと", bad: "困ったこと", even: "どちらでもないこと" }[ev.tone];
      html += '<div class="stage-h"><h2>' + E.monthLabel(S.m) + '</h2><small>今月の出来事</small></div>' +
        '<div class="panel evt ' + ev.tone + '"><span class="kicker">' + tone + "</span><h3>" + esc(ev.t) + '</h3><p class="txt">' + esc(E.fill(ev.d, G)) + '</p><div class="choices">' +
        ev.ch.map(function (c, i) { return '<button class="btn wide" data-act="evt" data-i="' + i + '">' + esc(c.l) + "</button>"; }).join("") + "</div></div>";
      st.innerHTML = html; return;
    }
    if (ui.evtRes) {
      html += '<div class="panel evt ' + ui.evtRes.event.tone + '"><span class="kicker">出来事：' + esc(ui.evtRes.event.t) + "</span><p class=\"txt\">" + esc(ui.evtRes.choice.l) + "。" + esc(ui.evtRes.text) + "</p>" + deltaChips(ui.evtRes.delta) + wordCards(ui.evtRes.words) + stockLines(ui.evtRes.stocks) + "</div>";
    }
    var hand = E.hand(G);
    var sub = S.sick > 0 ? "体調が戻るまで休みます" : S.K <= 0.05 ? "カネが尽きたので、守るしか選べません" : S.m < 2 ? "最初の2か月は、守ると試すから" : "1枚えらぶ";
    html += '<div class="stage-h"><h2>' + E.monthLabel(S.m) + "のカード</h2><small>" + sub + "</small></div>";
    if (S.m === 0 && !G.meta.seenHelp) html += '<p class="hint">カードをタップすると、選ぶ前に確かめられます。結果は、すぐに返ります。</p>';
    if (S.A >= 75 && S.m >= 2) html += '<p class="hint">軸が高いので、いまの向き以外のカードが出にくくなっています。</p>';
    hand.forEach(function (c) {
      var v = E.viewCard(G, c), sel = ui.sel === c.id;
      html += cardHtml(v, sel);
    });
    st.innerHTML = html;
    renderConfirm(hand);
  }
  function renderConfirm(hand) {
    var bar = $("#confirm");
    var c = hand ? hand.filter(function (x) { return x.id === ui.sel; })[0] : null;
    if (!c) { bar.hidden = true; bar.innerHTML = ""; sizeVars(); return; }
    var v = E.viewCard(G, c);
    bar.innerHTML = '<div class="confirm-in"><span class="cf-t"><span class="hint">' + TYL[v.ty] + "</span>" + esc(v.t) + '</span><button class="btn pri" data-act="choose" data-id="' + c.id + '">' +
      (c.ty === "bet" && c.id !== "focus" ? "期間と条件を決める" : "これにする") + "</button></div>";
    bar.hidden = false;
    sizeVars();
  }
  function resultHtml() {
    var n = E.node(G), r = ui.result, log = n.log;
    if (!log) return "";
    var S = E.ensureLive(G);
    var head, body = "";
    if (log.card === "rest") head = "休んだ月";
    else if (log.betStart) head = "賭けを始めた";
    else if (log.ty === "keep") head = log.good ? "守った" : "いつも通りの1か月";
    else if (log.card === "focus") head = log.good ? "手ごたえが近づいた" : "まだ手ごたえはない";
    else head = log.good ? "手ごたえあり" : "今回は、思うようにはいかなかった";
    body += '<p class="txt">' + esc(log.text) + "</p>";
    if (log.betStart) {
      var conds = log.betStart.conds.map(function (id) { return D.STOP_CONDS.filter(function (c) { return c.id === id; })[0].l; });
      body += '<p class="hint">期間：' + log.betStart.months + "か月／見込み：" + log.betStart.p + "%／やめる条件：" + (conds.length ? esc(conds.join("・")) : "決めていない") + "</p>";
    }
    body += deltaChips(log.delta);
    if (r && r.betEnd) body += '<div class="panel evt ' + (r.betEnd.kind === "pay" ? "good" : "") + '"><span class="kicker">' + (r.betEnd.kind === "pay" ? "賭けが実った" : "賭けの期間が終わった") + "：" + esc(r.betEnd.card.t) + '</span><p class="txt">' + esc(r.betEnd.text) + "</p>" + (r.betEnd.delta ? deltaChips(r.betEnd.delta) : "") + "</div>";
    else if (log.betEnd) body += '<p class="hint">賭け「' + esc(log.betEnd.title) + "」：" + (log.betEnd.kind === "pay" ? "実った" : "期間が終わった") + "</p>";
    var notes = (log.notes || []).map(function (t) { return "<p>" + esc(t) + "</p>"; }).join("") + stockLines(log.stocks);
    if (log.flow) notes += "<p>毎月の出入り：カネ" + sign(log.flow, "か月") + "</p>";
    if (notes) body += '<div class="notes">' + notes + "</div>";
    body += wordCards(log.words);
    if (ui.stopRes) body += '<p class="txt">' + esc(ui.stopRes.text) + "</p>" + wordCards(ui.stopRes.words);
    return '<div class="stage-h"><h2>' + E.monthLabel(S.m) + '</h2><small>' + esc(TYL[log.ty] || "") + "：" + esc(log.title) + "</small></div>" +
      '<div class="panel"><span class="kicker">結果</span><h3>' + head + "</h3>" + body + "</div>";
  }
  function nextHtml() {
    var S = E.ensureLive(G), y = E.year(S.m);
    var yearEnd = (S.m + 1) % 12 === 0 && !G.meta.kessan[y];
    return '<div class="go"><button class="btn pri wide" data-act="next">' + (yearEnd ? (y + 1) + "年目の決算を見る" : "次の月へ") + "</button>" +

  function restHtml() {
    return '<div class="rest"><div><h2>今日はここまで</h2><p>また来たときに、現実の一手がどうだったか聞かせてください。</p></div><button class="btn" data-act="resume">続きを遊ぶ</button></div>';
  }

  // ---------- 続けていること・賭け ----------
  function renderSide() {

      var b = S.bet, c = E.card(b.id);
      var bar = ""; for (var i = 0; i < b.dur; i++) bar += "<i" + (i < b.el ? ' class="on"' : "") + "></i>";

      html += '<div class="betbox"><b>賭けていること：' + esc(c.t) + '</b><div class="bar">' + bar + "</div>" +
        "<span>" + b.el + " / " + b.dur + "か月｜毎月 カネ−" + fk(c.mc) + "か月｜やめる条件：" + (conds.length ? esc(conds.join("・")) : "決めていない") + "</span></div>";
    }

  }

  // ---------- 年表 ----------
  function realMonths() {
    var set = {};
    G.meta.real.forEach(function (r) { if (r.status === "done") set[r.m] = (set[r.m] || 0) + 1; });
    return set;
  }
  function cellsHtml(path, opt) {
    opt = opt || {};
    var real = realMonths(), years = {}, html = "";
    path.forEach(function (n) { var y = E.year(n.m); (years[y] = years[y] || []).push(n); });
    Object.keys(years).forEach(function (y) {
      html += '<div class="yr"><span class="yr-l">' + (+y + 1) + '年目</span><div class="cells">';
      years[y].forEach(function (n) {
        var cls = "c";
        if (opt.dimBefore !== undefined && n.m < opt.dimBefore) cls += " shared";
        if (n.log) cls += " " + (n.log.ty === "bet" ? "bet" : n.log.ty);
        else if (n.id === G.cur && !opt.small) cls += " now";
        if (real[n.m]) cls += " real";
        if (n.fork) cls += " fork";
        var inbet = n.start.bet || (n.log && n.log.betStart);
        var lab = E.monthLabel(n.m) + (n.log ? "：" + TYL[n.log.ty] + "「" + n.log.title + "」" : "") + (real[n.m] ? "／現実でやったことあり" : "") + (n.fork ? "／ここで方向を変えた（" + n.fork.n + "回目）" : "");
        html += (opt.small ? '<span class="' + cls + '" title="' + esc(lab) + '">' : '<button type="button" class="' + cls + '" data-act="cell" data-id="' + n.id + '" aria-label="' + esc(lab) + '">') +
          (inbet ? '<span class="bl"></span>' : "") + (opt.small ? "</span>" : "</button>");
      });
      html += "</div></div>";
    });
    return '<div class="tl-row">' + html + "</div>";
  }
  function renderTimeline() {
    var tl = $("#tl");
    tl.innerHTML = cellsHtml(E.path(G));
    tl.scrollLeft = tl.scrollWidth;
  }

  function render() {
    E.ensureLive(G);
    renderHud(); renderBanner(); renderOffice(); renderStage(); renderSide(); renderTimeline();
    sizeVars();
  }
  function sizeVars() {
    var h = $(".hud"), d = $(".dock");
    if (h) document.documentElement.style.setProperty("--hud-h", h.offsetHeight + "px");
    var cf = $("#confirm");
    if (d) document.documentElement.style.setProperty("--dock-h", (d.offsetHeight + (cf && !cf.hidden ? cf.offsetHeight : 0)) + "px");
  }

  // ---------- 重ねて出す画面 ----------
  function sheet(html, onMount) {
    var s = $("#sheet");
    s.innerHTML = '<div class="sheet-in" role="dialog" aria-modal="true">' + html + "</div>";
    s.hidden = false;
    var inner = s.querySelector(".sheet-in");
    var f = s.querySelector("[autofocus]") || s.querySelector("button, input, textarea");
    if (onMount) onMount(inner);   // 中身ごとに作り直すので、聞き耳はここにつける（たまらない）
    if (f) { try { f.focus({ preventScroll: true }); } catch (e) { f.focus(); } }
    s.querySelector(".sheet-in").scrollTop = 0;
  }
  function closeSheet() { var s = $("#sheet"); s.hidden = true; s.innerHTML = ""; }

  // 初めて
  function openSetup() {
    var chips = D.STRENGTHS.map(function (s) { return '<button type="button" data-st="' + s.id + '" aria-pressed="false">' + s.label + "</button>"; }).join("");
    var roles = Object.keys(D.ROLES).map(function (k, i) {
      return '<label class="opt' + (i === 1 ? " on" : "") + '"><input type="radio" name="role" value="' + k + '"' + (i === 1 ? " checked" : "") + "><span>" + D.ROLES[k].label + "<small>はじめのカネ：" + D.ROLES[k].K + "か月</small></span></label>";
    }).join("");
    sheet('<h2>わたし株式会社をはじめる</h2>' +
      '<p class="lead">自分を1つの会社に見立てて、1か月ずつ経営します。やりたいことは、決めなくて大丈夫です。いま持っているものから、組み立てます。</p>' +
      '<label class="field" for="f-name">会社の名前<input id="f-name" type="text" maxlength="20" placeholder="わたし株式会社"></label>' +
      '<section><h3>いまの立場</h3><div class="opts" id="f-role">' + roles + "</div></section>" +
      '<section><h3>いま持っているもの（2つまで。なくても始められます）</h3><div class="chips" id="f-st">' + chips + "</div></section>" +
      '<button class="btn pri wide" data-act="setup-go">はじめる</button>', function (s) {
        s.querySelector("#f-st").addEventListener("click", function (e) {
          var b = e.target.closest("button[data-st]"); if (!b) return;
          var on = s.querySelectorAll('#f-st button[aria-pressed="true"]');
          if (b.getAttribute("aria-pressed") === "true") b.setAttribute("aria-pressed", "false");
          else if (on.length < 2) b.setAttribute("aria-pressed", "true");
        });
        s.querySelector("#f-role").addEventListener("change", function () {
          Array.prototype.forEach.call(s.querySelectorAll("#f-role .opt"), function (o) { o.classList.toggle("on", o.querySelector("input").checked); });
        });
      });
  }
  function setupGo() {
    var s = $("#sheet");
    var role = (s.querySelector('input[name="role"]:checked') || {}).value || "employee";
    var sts = Array.prototype.map.call(s.querySelectorAll('#f-st button[aria-pressed="true"]'), function (b) { return b.getAttribute("data-st"); });
    G = E.newGame({ name: s.querySelector("#f-name").value, role: role, strengths: sts });
    G.meta.lastActive = Date.now();
    ui.prev = null; ui.result = null; ui.sel = null; ui.evtRes = null;
    save();
    openHowto(true);
    render();
  }
  function openHowto(first) {
    sheet("<h2>遊び方</h2>" +
      '<section><p>1か月に1回、3枚のカードから1枚を選びます。<b>守る・試す・賭ける</b>の3種類です。</p>' +
      "<p>動くのは、<b>ヒト・モノ・カネ・軸</b>の4つ。カネは「あと何か月、挑戦できるか」です。0になると、守るしか選べなくなります。</p>" +
      "<p>賭けるときは、期間と「やめる条件」を先に決めます。</p>" +
      "<p>下の年表の月をタップすると、<b>いつでもその月に戻れます</b>。戻った記録も、年表に残ります。</p>" +
      "<p>終わりはありません。12か月ごとに決算があります。やめるときは<b>「今日はここまで」</b>を押してください。現実で今週やってみることを、1つだけ決めて終わります。</p></section>" +
      '<p class="hint">同じ月に同じカードを選ぶと、同じ結果になります。ちがう結果を見たいときは、ちがう選択をしてみてください。</p>' +
      '<button class="btn pri wide" data-act="close">' + (first ? "1か月目を始める" : "閉じる") + "</button>");
  }

  // 賭けの設定
  function openBet(id) {
    var c = E.card(id), S = E.ensureLive(G);
    var durs = [3, 6, 12].map(function (m, i) {
      var p = E.chance(G, S, c, m), total = Math.round((c.c + c.mc * m) * 10) / 10;
      return '<label class="opt' + (m === 6 ? " on" : "") + '"><input type="radio" name="dur" value="' + m + '"' + (m === 6 ? " checked" : "") + "><span>" + m + "か月<small>見込み " + p + "%／使うカネ：最初に" + fk(c.c) + "か月分＋毎月" + fk(c.mc) + "か月分（合計 最大" + fk(total) + "か月分）</small></span></label>";
    }).join("");
    var low = S.K - c.c < 3;
    var conds = D.STOP_CONDS.map(function (x) {
      var sm = x.id === "money" && low ? "<small>いまのカネで始めると、最初から3か月分を切ります。選ぶと、すぐに確認が入ります。</small>"
        : x.id === "nores" ? "<small>3か月で試すときは、この条件には触れません。</small>" : "";
      return '<label class="opt"><input type="checkbox" name="cond" value="' + x.id + '"><span>' + x.l + sm + "</span></label>";
    }).join("");
    sheet('<span class="hint">賭ける</span><h2>' + esc(E.fill(c.t, G)) + '</h2><p class="lead">' + esc(E.fill(c.d, G)) + "</p>" +
      '<section><h3>これを、何か月やってみますか？</h3><div class="opts" id="b-dur">' + durs + "</div></section>" +
      '<section><h3>何が起きたら、やめますか？</h3><div class="opts" id="b-cond">' + conds + '</div><p class="hint" id="b-none">決めないと、途中でやめどきを知らせてくれる人がいません。</p></section>' +
      '<p class="hint">実ったら：' + esc(E.gainsText(c).join("・")) + "</p>" +
      '<div class="row"><button class="btn dark" data-act="bet-go" data-id="' + id + '">賭ける</button><button class="btn ghost" data-act="close">やめておく</button></div>', function (s) {
        s.addEventListener("change", function () {
          Array.prototype.forEach.call(s.querySelectorAll(".opt"), function (o) { o.classList.toggle("on", o.querySelector("input").checked); });
          s.querySelector("#b-none").hidden = !!s.querySelector('input[name="cond"]:checked');
        });
      });
  }
  function betGo(id) {
    var s = $("#sheet");
    var months = +((s.querySelector('input[name="dur"]:checked') || {}).value || 6);
    var conds = Array.prototype.map.call(s.querySelectorAll('input[name="cond"]:checked'), function (x) { return x.value; });
    closeSheet();
    doChoose(id, { months: months, conds: conds });
  }

  function doChoose(id, opt) {
    var res = E.choose(G, id, opt);
    if (!res) return;
    ui.result = res; ui.sel = null; ui.stopRes = null; ui.evtRes = null;
    G.meta.seenHelp = true;
    save(); render();
    window.scrollTo({ top: 0, behavior: "auto" });
  }
  function doNext() {
    var S = E.ensureLive(G), y = E.year(S.m);
    if ((S.m + 1) % 12 === 0 && !G.meta.kessan[y]) { openKessan(y); return; }
    advance();
  }
  function advance() {
    if (!E.nextMonth(G)) return;
    ui.result = null; ui.sel = null; ui.stopRes = null; ui.evtRes = null;
    save(); render();
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  // 決算
  function openKessan(y) {
    var s = E.yearSummary(G, y);
    var maxv = function (a, b) { return Math.max(1, a, b); };
    function cmp(lab, a, b, unit) {
      var mx = lab === "軸" ? 100 : maxv(a, b) * 1.15;
      return '<div class="cmp-row"><b>' + lab + '</b><div class="cmp-bar"><i style="width:' + Math.round(a / mx * 100) + '%"></i><span class="num">' + fk(a) + (unit || "") + '</span></div><div class="cmp-bar now"><i style="width:' + Math.round(b / mx * 100) + '%"></i><span class="num">' + fk(b) + (unit || "") + "</span></div></div>";
    }
    var tot = s.list.length || 1;
    var ratio = ["keep", "try", "bet"].map(function (k) { return '<i class="' + k + '" style="width:' + (s.count[k] / tot * 100) + '%"></i>'; }).join("");
    var list = s.list.map(function (x) { return '<div><span>' + E.monthShort(x.m) + '</span><span class="t">' + TYL[x.ty] + "</span><span>" + esc(x.title) + "</span></div>"; }).join("");
    var words = s.words.map(function (id) { var w = E.word(id); return w ? "<span>" + esc(w.w) + "</span>" : ""; }).join("・");
    sheet('<span class="hint">' + (y + 1) + "年目の決算</span><h2>この1年をふりかえる</h2>" +
      (s.prevNote ? '<section><h3>1年前のあなたからのひとこと</h3><p class="note-prev">' + esc(s.prevNote.text) + "</p></section>" : "") +
      (s.real ? '<p class="bigline">この1年で、現実で<b>' + s.real + "回</b>動きました。</p>"
        : '<p class="bigline">この1年の、現実の記録はまだありません。</p><p class="hint">「今日はここまで」で今週の一手を1つ決めて、次に開いたときに「やった」を選ぶと、ここに残ります。</p>') +
      '<section><h3>1年前といま</h3><div class="cmp"><div class="cmp-row"><span></span><span class="hint">1年前</span><span class="hint">いま</span></div>' +
      cmp("ヒト", s.from.H, s.to.H) + cmp("モノ", s.from.M, s.to.M) + cmp("カネ", s.from.K, s.to.K, "か月") + cmp("軸", s.from.A, s.to.A) + "</div></section>" +
      '<section><h3>守る・試す・賭ける</h3><div class="ratio">' + ratio + '</div><p class="hint">守る ' + s.count.keep + "回・試す " + s.count.try + "回・賭ける " + s.count.bet + "回</p></section>" +
      '<section><h3>この1年で選んだカード</h3><div class="yl">' + list + "</div></section>" +
      (words ? "<section><h3>この1年で出会ったことば</h3><p>" + words + "</p></section>" : "") +
      "<section><h3>この1年の様子</h3><p>" + esc(s.comment) + "</p>" + s.obs.map(function (o) { return "<p>" + esc(o) + "</p>"; }).join("") +
      (s.stocks.length ? "<p>続けていること：" + esc(s.stocks.join("、")) + "</p>" : "") + "<p>働き方：" + esc(s.work) + "</p></section>" +
      '<section><h3>来年の自分に、ひとこと残しますか？</h3><label class="field" for="k-note"><span class="hint">ここに書いたことは、来年の決算で表示されます。</span><textarea id="k-note" maxlength="200"></textarea></label></section>' +
      '<div class="row"><button class="btn pri" data-act="kessan-go" data-y="' + y + '">残して、次の年へ</button><button class="btn ghost" data-act="kessan-skip" data-y="' + y + '">残さずに、次の年へ</button></div>');
  }
  function kessanDone(y, withNote) {
    var t = withNote ? ($("#k-note") || {}).value : "";
    if (withNote && t && t.trim()) { E.saveNote(G, y, t); var S = E.ensureLive(G); S.A = Math.min(100, S.A + 3); }
    var w = E.markKessan(G, y);
    closeSheet();
    advance();
    if (w.length) { ui.evtRes = null; showWordToast(w); }
  }
  function showWordToast(ids) {
    var w = ids.map(function (id) { return E.word(id); }).filter(Boolean)[0];
    if (!w) return;
    var b = $("#note"); if (!b) return;
    b.innerHTML = "ことばを獲得：<b>" + esc(w.w) + "</b>（" + esc(w.m) + "）"; b.hidden = false;
  }

  // 年表の1か月
  function openCell(id) {
    var n = G.nodes[id]; if (!n) return;
    var real = G.meta.real.filter(function (r) { return r.m === n.m; });
    var html = '<span class="hint">年表</span><h2>' + E.monthLabel(n.m) + "</h2>";
    if (n.fork) html += '<p class="hint">ここで方向を変えました（' + n.fork.n + "回目）。</p>";
    if (n.log) {
      if (n.log.evt) { var ev = E.event(n.log.evt); html += "<section><h3>出来事</h3><p>" + esc(ev ? ev.t : "") + (n.log.evtLabel ? "→" + esc(n.log.evtLabel) : "") + "</p></section>"; }
      html += "<section><h3>" + TYL[n.log.ty] + "：" + esc(n.log.title) + "</h3><p>" + esc(n.log.text) + "</p>" + deltaChips(n.log.delta) + "</section>";
    } else html += "<p>いまの月です。</p>";
    if (real.length) html += "<section><h3>現実でやったこと</h3>" + real.map(function (r) { return "<p>" + esc(r.text) + "（" + realStatus(r.status) + "）</p>"; }).join("") + "</section>";
    var can = E.canRewind(G, id);
    if (can) html += '<section><p class="hint">この月の初めに戻ります。いまの道は消えずに、年表と「別の道」に残ります。戻ると、軸が少し上がります。</p><button class="btn dark wide" data-act="rewind" data-id="' + id + '">この月の初めからやり直す</button></section>';
    html += '<button class="btn ghost wide" data-act="close">閉じる</button>';
    sheet(html);
  }
  function realStatus(s) { return { pending: "結果はまだ", partial: "途中", done: "やった", notyet: "また今度" }[s] || s; }
  function doRewind(id) {
    var res = E.rewind(G, id);   // いまの月なら「この月を選び直す」。結果は消さずに残る
    if (!res) return;
    closeSheet();
    ui.result = null; ui.sel = null; ui.evtRes = null; ui.stopRes = null;
    save(); render();
    var b = $("#note");
    if (b) { b.innerHTML = E.monthLabel(E.ensureLive(G).m) + "に戻りました。方向を変えたのは" + res.n + "回目です。" + (res.bonus ? "軸が" + res.bonus + "上がりました。" : ""); b.hidden = false; }
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  // 別の道
  function openRoutes() {
    var rs = E.routes(G);
    var html = '<h2>年表と、別の道</h2><p class="lead">やり直した道も、消さずに並べています。どちらが良い・悪いは、ありません。</p><p class="hint">薄い部分は、ほかの道と同じところ。濃い部分が、分かれてからの道です。</p><div class="routes">';
    rs.forEach(function (r, i) {
      var label = r.current ? "いまの道" : (r.fork ? (r.fork.n + "回目に分かれた道") : "はじめの道");
      var e = r.end;
      html += '<div class="route' + (r.current ? " cur" : "") + '"><div class="rh"><span>' + label + "</span><span>" + E.monthLabel(e.m) + "まで</span></div>" +
        '<div class="rs">' + cellsHtml(r.path, { small: true, dimBefore: r.fork ? r.forkM : undefined }) + "</div>" +
        '<p class="end num">ヒト ' + e.H + "・モノ " + e.M + "・カネ " + fk(e.K) + "か月・軸 " + e.A + (r.fork ? "｜" + E.monthLabel(r.forkM) + "から分かれた" : "") + "</p>" +
        (r.current ? "" : '<button class="btn" data-act="switch" data-id="' + r.leaf + '">この道の続きを遊ぶ</button>') + "</div>";
    });
    html += '</div><button class="btn ghost wide" data-act="close">閉じる</button>';
    sheet(html);
  }

  // 図鑑
  function openDex() {
    var got = G.meta.words, n = Object.keys(got).length;
    var html = '<h2>ことば図鑑</h2><p class="lead">' + n + " / " + D.WORDS.length + "。そのことばが関わることを、実際に経験したときに出会います。</p><div class=\"dex\">";
    D.WORDS.forEach(function (w, i) {
      var g = got[w.id];
      if (g) html += '<div class="dx"><span class="no">No.' + (i + 1 < 10 ? "0" : "") + (i + 1) + "</span><b>" + esc(w.w) + "</b><p>" + esc(w.m) + '</p><span class="when">' + E.monthLabel(g.m) + "に出会った</span></div>";
      else html += '<div class="dx off"><span class="no">No.' + (i + 1 < 10 ? "0" : "") + (i + 1) + "</span><b>？？？</b></div>";
    });
    html += '</div><button class="btn ghost wide" data-act="close">閉じる</button>';
    sheet(html);
  }

  // 今日はここまで
  function openExit() {
    var t = G.meta.session.tries || 0, turns = G.meta.session.turns || 0;
    var q = t > 0 ? "今日、ゲームの中で【試す】を" + t + "回選びましたね。現実で、今週ひとつだけ試すなら、何にしますか？"
      : "今日は、ゲームの中で【試す】を選びませんでしたね。それでも、現実で今週ひとつだけ試すなら、何にしますか？";
    var kinds = D.REAL_KINDS.map(function (k, i) { return '<label class="opt"><input type="radio" name="rk" value="' + k.id + '"><span>' + k.l + "</span></label>"; }).join("");
    sheet('<h2>今日はここまで</h2><p class="lead">今日は' + turns + "か月すすめました。</p>" +
      "<section><h3>" + q + '</h3><div class="opts" id="x-kind">' + kinds + "</div>" +
      '<label class="field" for="x-text">くわしく（だれに・何を。書かなくてもいい）<input id="x-text" type="text" maxlength="80" placeholder="例：近所のパン屋さんに、最近困ったことを聞く"></label></section>' +
      '<div class="row"><button class="btn pri" data-act="exit-2">次へ</button><button class="btn ghost" data-act="close">まだ続ける</button></div>', function (s) {
        s.addEventListener("change", function () { Array.prototype.forEach.call(s.querySelectorAll(".opt"), function (o) { o.classList.toggle("on", o.querySelector("input").checked); }); });
      });
  }
  var exitDraft = null;
  function exit2() {
    var s = $("#sheet");
    var k = (s.querySelector('input[name="rk"]:checked') || {}).value;
    var txt = s.querySelector("#x-text").value.trim();
    if (!k) { s.querySelector("#x-kind").insertAdjacentHTML("afterend", '<p class="warnbox">1つ選んでください。決めきれないときは「自分で決める」に、思いついたことを書いてください。</p>'); return; }
    if (k === "own" && !txt) { s.querySelector("#x-text").focus(); s.querySelector("#x-text").placeholder = "自分で決めたことを、ひとことで"; return; }
    var kl = D.REAL_KINDS.filter(function (x) { return x.id === k; })[0].l;
    exitDraft = { kind: k, text: txt ? (k === "own" ? txt : kl + "：" + txt) : kl };
    var stops = D.REAL_STOPS.map(function (l, i) { return '<label class="opt"><input type="radio" name="rs" value="' + i + '"><span>' + l + "</span></label>"; }).join("");
    sheet("<h2>今週の一手</h2><p class=\"note-prev\">" + esc(exitDraft.text) + "</p>" +
      '<section><h3>それを、何が起きたらやめますか？</h3><div class="opts">' + stops + '</div><label class="field" for="x-stop">自分で決めるとき<input id="x-stop" type="text" maxlength="60"></label></section>' +
      '<div class="row"><button class="btn pri" data-act="exit-3">決めて、今日は終わる</button><button class="btn ghost" data-act="close">まだ続ける</button></div>', function (s2) {
        s2.addEventListener("change", function () { Array.prototype.forEach.call(s2.querySelectorAll(".opt"), function (o) { o.classList.toggle("on", o.querySelector("input").checked); }); });
      });
  }
  function exit3() {
    var s = $("#sheet");
    var i = (s.querySelector('input[name="rs"]:checked') || {}).value;
    var own = s.querySelector("#x-stop").value.trim();
    var stop = i === undefined ? (own || "決めていない") : (+i === 3 ? (own || "自分で決める") : D.REAL_STOPS[+i]);
    var item = E.addReal(G, { kind: exitDraft.kind, text: exitDraft.text, stop: stop });
    G.meta.session = { at: Date.now(), tries: 0, turns: 0 };
    save();
    sheet("<h2>今週の一手を決めました</h2><p class=\"note-prev\">" + esc(item.text) + '</p><p class="hint">やめる条件：' + esc(stop) + "</p>" +
      "<p>次に開いたとき、どうだったか聞かせてください。やらなかったとしても、責めたりしません。</p>" +
      '<label class="field" for="x-copy">手帳やメモに写すとき<textarea id="x-copy" readonly>' + esc("今週の一手：" + item.text + "\nやめる条件：" + stop) + "</textarea></label>" +
      '<div class="row"><button class="btn" data-act="copy-ichite">写す（コピー）</button><button class="btn pri" data-act="exit-done">閉じる</button></div>');
  }

  // 次に開いたとき
  var returnQueue = [];
  function openReturn() {
    var it = returnQueue[0];
    if (!it) { closeSheet(); render(); return; }
    var d = new Date(it.at);
    sheet('<span class="hint">おかえりなさい</span><h2>前回の一手は、どうなりましたか？</h2>' +
      '<p class="note-prev">' + esc(it.text) + '</p><p class="hint">' + (d.getMonth() + 1) + "月" + d.getDate() + "日に決めたこと／やめる条件：" + esc(it.stop || "") + "</p>" +
      '<div class="opts"><button class="btn pri wide" data-act="ret" data-v="done">やった</button><button class="btn wide" data-act="ret" data-v="partial">途中</button><button class="btn wide" data-act="ret" data-v="notyet">やらなかった</button></div>');
  }
  function doReturn(v) {
    var it = returnQueue.shift();
    var r = E.resolveReal(G, it.id, v);
    save();
    var msg = v === "done" ? "モノが1つ増えました。現実でやったことが、年表に濃い色で残ります。" : v === "partial" ? "そのままにしておきます。次にまた聞きます。" : "また今度でいいです。";
    sheet('<h2>' + (v === "done" ? "やりましたね" : v === "partial" ? "途中ですね" : "わかりました") + "</h2><p>" + msg + "</p>" + (r ? wordCards(r.words) : "") +
      '<button class="btn pri wide" data-act="ret-next">' + (returnQueue.length ? "次の一手へ" : "続きを遊ぶ") + "</button>");
    ui.prev = null;
  }

  // メニュー
  function openMenu() {
    sheet("<h2>メニュー</h2><div class=\"opts\">" +
      '<button class="btn wide" data-act="m-howto">遊び方</button>' +
      '<button class="btn wide" data-act="m-dex">ことば図鑑</button>' +
      '<button class="btn wide" data-act="m-routes">年表と、別の道</button>' +
      '<button class="btn wide" data-act="m-real">現実の一手の記録</button>' +
      '<button class="btn wide" data-act="m-export">データを書き出す</button>' +
      '<button class="btn wide" data-act="m-import">データを読み込む</button>' +
      '<button class="btn ghost wide" data-act="m-reset">最初からはじめる</button>' +
      '</div><p class="hint">データは、この端末のブラウザに保存しています。端末を変えるときは「書き出す」で写して、新しい端末で「読み込む」に貼ってください。</p>' +
      '<button class="btn ghost wide" data-act="close">閉じる</button>');
  }
  function openRealLog() {
    var list = G.meta.real.slice().reverse();
    var html = '<h2>現実の一手の記録</h2><p class="lead">現実で動いた回数：' + E.realDone(G) + "回</p>";
    if (!list.length) html += '<p class="empty">まだありません。「今日はここまで」で、1つ決めて終わると、ここに残ります。</p>';
    html += '<div class="reallist">' + list.map(function (r) {
      return '<div class="realitem' + (r.status === "done" ? " done" : "") + '"><span class="s">' + realStatus(r.status) + "｜" + E.monthLabel(r.m) + "のあとに決めた</span><span>" + esc(r.text) + '</span><span class="hint">やめる条件：' + esc(r.stop || "") + "</span>" +
        (r.status === "pending" || r.status === "partial" ? '<div class="row"><button class="btn" data-act="real-set" data-id="' + r.id + '" data-v="done">やった</button><button class="btn ghost" data-act="real-set" data-id="' + r.id + '" data-v="notyet">また今度</button></div>' : "") + "</div>";
    }).join("") + '</div><button class="btn ghost wide" data-act="close">閉じる</button>';
    sheet(html);
  }
  function openExport() {
    var txt = E.exportJSON(G);
    sheet("<h2>データを書き出す</h2><p class=\"lead\">下の文字を全部写して、別の端末の「読み込む」に貼ると、続きから遊べます。</p>" +
      '<label class="field" for="ex-t">書き出したデータ<textarea id="ex-t" class="code" readonly>' + esc(txt) + "</textarea></label>" +
      '<div class="row"><button class="btn pri" data-act="ex-copy">コピーする</button><button class="btn" data-act="ex-file">ファイルに保存</button></div>' +
      '<button class="btn ghost wide" data-act="close">閉じる</button>');
  }
  function openImport() {
    sheet("<h2>データを読み込む</h2><p class=\"lead\">書き出したデータを貼るか、保存したファイルを選んでください。いまのデータは置きかわります。</p>" +
      '<label class="field" for="im-t">データ<textarea id="im-t" class="code"></textarea></label>' +
      '<label class="field" for="im-f">ファイルから<input id="im-f" type="file" accept=".json,application/json,text/plain"></label>' +
      '<p class="warnbox" id="im-err" hidden></p>' +
      '<div class="row"><button class="btn pri" data-act="im-go">読み込む</button><button class="btn ghost" data-act="close">やめる</button></div>', function (s) {
        s.querySelector("#im-f").addEventListener("change", function (e) {
          var f = e.target.files && e.target.files[0]; if (!f) return;
          var rd = new FileReader(); rd.onload = function () { s.querySelector("#im-t").value = rd.result; }; rd.readAsText(f);
        });
      });
  }
  function importGo() {
    var s = $("#sheet"), err = s.querySelector("#im-err");
    try {
      var g = E.importJSON(s.querySelector("#im-t").value);
      G = g; G.meta.session = { at: Date.now(), tries: 0, turns: 0 };
      ui.prev = null; ui.result = null; ui.sel = null; ui.evtRes = null;
      save(); closeSheet(); render();
      toastNote("読み込みました。" + E.monthLabel(E.ensureLive(G).m) + "の続きからです。");
    } catch (e) { err.hidden = false; err.textContent = "読み込めませんでした。書き出したデータを、最初から最後まで貼ってください。"; }
  }
  function openReset() {
    sheet("<h2>最初からはじめる</h2><p>いまのデータ（年表・ことば図鑑・現実の一手の記録）は消えます。残したいときは、先に「データを書き出す」で写してください。</p>" +
      '<div class="row"><button class="btn dark" data-act="reset-go">消して、最初から</button><button class="btn ghost" data-act="close">やめる</button></div>');
  }

  // ファイルに保存：claude.ai の中では downloads の機能で、それ以外ではブラウザの保存で
  function saveFile(text, btn) {
    var name = "watashi-kabushiki-" + new Date().toISOString().slice(0, 10) + ".json";
    var c = window.claude;
    if (WK.ENV === "artifact" || (embedded && c && c.use)) {
      if (!c || !c.use) { btn.textContent = "ここでは保存できません。コピーしてください"; return; }
      btn.textContent = "保存の準備中…";
      c.use("downloads").then(function (dl) {
        if (!dl) { btn.textContent = "ここでは保存できません。コピーしてください"; return; }
        return dl.save({ filename: name, data: text }).then(function () { btn.textContent = "保存しました"; },
          function (e) { btn.textContent = e && e.code === "declined" ? "保存しませんでした" : "保存できませんでした。コピーしてください"; });
      }, function () { btn.textContent = "保存できませんでした。コピーしてください"; });
      return;
    }
    /*BLOB*/
    try {
      var blob = new Blob([text], { type: "application/json" });
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
      btn.textContent = "保存しました";
    } catch (er) { btn.textContent = "保存できませんでした。コピーしてください"; }
    /*END BLOB*/
  }
  function copyText(t, btn) {
    function done(ok) { if (btn) btn.textContent = ok ? "コピーしました" : "選んで写してください"; }
    try { navigator.clipboard.writeText(t).then(function () { done(true); }, function () { done(false); }); }
    catch (e) { done(false); }
  }

  // ---------- 操作 ----------
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var act = b.getAttribute("data-act"), id = b.getAttribute("data-id");
    switch (act) {
      case "pick": ui.sel = ui.sel === id ? null : id; renderStage(); break;
      case "choose":
        var c = E.card(id);
        if (c.ty === "bet" && c.id !== "focus") openBet(id); else doChoose(id);
        break;
      case "bet-go": betGo(id); break;
      case "evt":
        ui.evtRes = E.resolveEvent(G, +b.getAttribute("data-i"));
        save(); render(); break;
      case "next": doNext(); break;
      case "redo-month": doRewind(G.cur); break;
      case "stop-quit": ui.stopRes = E.stopDecision(G, true); save(); render(); break;
      case "stop-cont": ui.stopRes = E.stopDecision(G, false); save(); render(); break;
      case "kessan-go": kessanDone(+b.getAttribute("data-y"), true); break;
      case "kessan-skip": kessanDone(+b.getAttribute("data-y"), false); break;
      case "cell": openCell(id); break;
      case "rewind": doRewind(id); break;
      case "switch": E.switchRoute(G, id); ui.result = null; ui.sel = null; ui.evtRes = null; save(); closeSheet(); render(); break;
      case "close": closeSheet(); render(); break;
      case "setup-go": setupGo(); break;
      case "nav-routes": openRoutes(); break;
      case "nav-dex": openDex(); break;
      case "nav-exit": openExit(); break;
      case "nav-menu": openMenu(); break;
      case "exit-2": exit2(); break;
      case "exit-3": exit3(); break;
      case "copy-ichite": copyText($("#x-copy").value, b); break;
      case "exit-done": closeSheet(); ui.resting = true; render(); break;
      case "resume": ui.resting = false; render(); break;
      case "ret": doReturn(b.getAttribute("data-v")); break;
      case "ret-next": openReturn(); break;
      case "m-howto": openHowto(false); break;
      case "m-dex": openDex(); break;
      case "m-routes": openRoutes(); break;
      case "m-real": openRealLog(); break;
      case "real-set": var rr = E.resolveReal(G, id, b.getAttribute("data-v")); save(); openRealLog(); if (rr && rr.words.length) showWordToast(rr.words); break;
      case "m-export": openExport(); break;
      case "ex-copy": copyText($("#ex-t").value, b); break;
      case "ex-file": saveFile($("#ex-t").value, b); break;
      case "m-import": openImport(); break;
      case "im-go": importGo(); break;
      case "m-reset": openReset(); break;
      case "reset-go":
        try { localStorage.removeItem(KEY); } catch (er) { }
        G = null; ui = { sel: null, result: null, evtRes: null, prev: null, saveWarned: false, resting: false };
        closeSheet(); openSetup(); break;
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !$("#sheet").hidden && !$("#sheet .sheet-in [data-act=setup-go]")) { closeSheet(); render(); }
  });
  window.addEventListener("resize", sizeVars);

  // ---------- 起動 ----------
  function boot() {
    G = load();
    if (!G) { renderEmpty(); openSetup(); return; }
    E.ensureLive(G);
    var now = Date.now();
    var last = G.meta.lastActive || 0;
    if (now - last > 2 * 3600 * 1000 || !G.meta.session) G.meta.session = { at: now, tries: 0, turns: 0 };
    // 前のセッションで決めた一手を聞く
    returnQueue = E.pendingReal(G).filter(function (r) { return r.at < (G.meta.session.at || now) || now - r.at > 2 * 3600 * 1000; }).slice(0, 3);
    render();
    if (returnQueue.length) openReturn();
  }
  function renderEmpty() {
    $("#stats").innerHTML = ""; $("#stage").innerHTML = ""; $("#side").innerHTML = ""; $("#tl").innerHTML = "";
    $("#office").innerHTML = ""; $("#banner").innerHTML = '<p id="note" class="hint" hidden></p>';
  }
  boot();
})();

</script>
</body>
</html>
